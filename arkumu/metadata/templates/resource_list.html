{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">Resources</h1>
        <a href="{% url 'metadata:dashboard' %}" class="btn btn-outline">Back to Dashboard</a>
    </div>
    
    <!-- Filters -->
    <div class="card bg-base-100 shadow-xl mb-6">
        <div class="card-body">
            <h2 class="card-title">Filters</h2>
            
            <form id="filter-form" class="grid grid-cols-1 md:grid-cols-3 gap-4" hx-get="{% url 'metadata:resource_list' %}" hx-target="#resource-list" hx-swap="innerHTML" hx-trigger="change, submit">
                <div class="form-control">
                    <label class="label">Resource Type</label>
                    <select name="type" class="select select-bordered">
                        <option value="">All Types</option>
                        {% for value, label in resource_types %}
                        <option value="{{ value }}" {% if request.GET.type == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-control">
                    <label class="label">Institution</label>
                    <select name="institution" class="select select-bordered">
                        <option value="">All Institutions</option>
                        {% for institution in institutions %}
                        <option value="{{ institution }}" {% if request.GET.institution == institution %}selected{% endif %}>{{ institution }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-control">
                    <label class="label">Search</label>
                    <div class="input-group">
                        <input type="text" name="q" value="{{ request.GET.q }}" placeholder="Search..." class="input input-bordered w-full" hx-trigger="keyup changed delay:500ms">
                        <button type="submit" class="btn btn-square">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Results -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title">Results</h2>
            
            <div id="resource-list">
                {% include "partials/resource_list.html" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
