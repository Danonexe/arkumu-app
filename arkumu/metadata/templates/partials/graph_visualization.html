<!-- Graph Visualization with DaisyUI Components -->
<div class="h-full flex flex-col">
    {% if error %}
    <div class="alert alert-error">
        <div class="flex-1">
            <svg class="w-6 h-6 mx-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <label>{{ error }}</label>
        </div>
    </div>
    {% else %}

    
    <div class="flex flex-row h-full gap-4">
        <!-- Graph visualization -->
        <div class="flex-1 h-full relative" id="graph-vis-container">
            <div id="graph-vis" class="h-full"></div>
        </div>
        
        <!-- Details panel -->
        <div class="w-64 bg-base-200 rounded-lg p-3 overflow-y-auto" id="node-details">
            <h3 class="text-sm font-semibold mb-2">Node Details</h3>
            <div id="node-details-content" class="text-xs">
                <p class="text-base-content/60">Click on a node to see details</p>
            </div>
        </div>
    </div>
    
    <script>
        // Minimal JavaScript ONLY for vis.js operations
        // All interaction logic moved to hyperscript
        
        console.log('Graph visualization script starting...');
        console.log('Graph data nodes:', {{ graph_data.nodes|length }});
        console.log('Graph data links:', {{ graph_data.links|length }});
        
        // Simple graph operations for hyperscript to call
        window.GraphAPI = {
            network: null,
            nodes: null,
            edges: null,
            originalNodeColors: new Map(),
            
            // Initialize the graph (called once)
            init: function() {
                console.log('Initializing graph...');
                
                const container = document.getElementById('graph-vis');
                const nodeDetailsContent = document.getElementById('node-details-content');
                
                if (!container) {
                    console.error('Graph container not found!');
                    return false;
                }
                
                try {
                    // Prepare the data
                    const nodesData = JSON.parse('{{ graph_data.nodes|escapejs }}');
                    const linksData = JSON.parse('{{ graph_data.links|escapejs }}');
                    
                    // Enhance nodes with better visual properties based on type
                    nodesData.forEach(node => {
                        // Store original colors
                        this.originalNodeColors.set(node.id, node.color);
                        
                        // Set size and shape based on node type
                        if (node.type === 'dataset') {
                            node.size = 35;
                            node.shape = 'diamond';
                            node.font = { size: 14, color: '#ffffff' };
                        } else if (node.type === 'column') {
                            node.size = 25;
                            node.shape = 'box';
                            node.font = { size: 11, color: '#333333' };
                        } else if (node.type === 'cell') {
                            node.size = 15;
                            node.shape = 'dot';
                            node.font = { size: 9, color: '#666666' };
                        } else {
                            node.size = 20;
                            node.shape = 'dot';
                        }
                        
                        // Add better visual spacing
                        node.margin = { top: 5, right: 10, bottom: 5, left: 10 };
                    });
                    
                    this.nodes = new vis.DataSet(nodesData);
                    this.edges = new vis.DataSet(linksData);
                    
                    // Network configuration with improved spacing and layout
                    const options = {
                        nodes: {
                            shape: 'dot',
                            size: 25,
                            font: {
                                size: 12,
                                color: '#333333',
                                face: 'Inter, system-ui, sans-serif',
                                strokeWidth: 2,
                                strokeColor: '#ffffff'
                            },
                            borderWidth: 2,
                            shadow: { enabled: true, color: 'rgba(0,0,0,0.2)', size: 6, x: 2, y: 2 },
                            margin: 10
                        },
                        edges: {
                            width: 1.5,
                            shadow: { enabled: true, color: 'rgba(0,0,0,0.1)', size: 3, x: 1, y: 1 },
                            smooth: { enabled: true, type: 'continuous', roundness: 0.3 },
                            arrows: { to: { enabled: true, scaleFactor: 0.6, type: 'arrow' } },
                            color: { color: '#848484', highlight: '#2563eb', hover: '#2563eb' },
                            length: 200
                        },
                        physics: {
                            enabled: true,
                            stabilization: { 
                                enabled: true, 
                                iterations: 200, 
                                updateInterval: 25,
                                onlyDynamicEdges: false,
                                fit: true
                            },
                            forceAtlas2Based: {
                                gravitationalConstant: -50,
                                centralGravity: 0.01,
                                springLength: 200,
                                springConstant: 0.08,
                                damping: 0.4,
                                avoidOverlap: 1
                            },
                            maxVelocity: 50,
                            minVelocity: 0.75
                        },
                        {% if layout == 'hierarchical' %}
                        layout: {
                            hierarchical: {
                                enabled: true, direction: 'UD', sortMethod: 'directed',
                                levelSeparation: 200, nodeSpacing: 150
                            }
                        },
                        physics: { enabled: false },
                        {% endif %}
                        interaction: {
                            hover: true, dragNodes: false, dragView: true,
                            zoomView: true, multiselect: false
                        }
                    };
                    
                    // Create network
                    this.network = new vis.Network(container, { nodes: this.nodes, edges: this.edges }, options);
                    
                    // Better stabilization handling
                    this.network.on('stabilizationIterationsDone', () => {
                        console.log('Graph stabilization complete - disabling physics');
                        this.network.setOptions({ physics: { enabled: false } });
                        // Fit the network to view after stabilization
                        setTimeout(() => {
                            this.network.fit({
                                animation: { duration: 1000, easingFunction: 'easeInOutQuad' }
                            });
                        }, 100);
                    });
                    
                    // Extended timeout fallback for complex graphs
                    setTimeout(() => {
                        console.log('Physics timeout - forcing stabilization');
                        this.network.setOptions({ physics: { enabled: false } });
                        this.network.fit({
                            animation: { duration: 1000, easingFunction: 'easeInOutQuad' }
                        });
                    }, 6000);
                    
                    // Node click handler
                    this.network.on("click", (params) => {
                        if (params.nodes.length > 0) {
                            const nodeId = params.nodes[0];
                            const node = this.nodes.get(nodeId);
                            this.showNodeDetails(node, nodeId);
                        } else {
                            nodeDetailsContent.innerHTML = '<p class="text-base-content/60">Click on a node to see details</p>';
                        }
                    });
                    
                    console.log('Graph initialized successfully');
                    
                    // Update debug status
                    const statusEl = document.getElementById('graph-status');
                    const nodeCountEl = document.getElementById('node-count');
                    if (statusEl) statusEl.textContent = 'Yes';
                    if (nodeCountEl) nodeCountEl.textContent = this.nodes.length;
                    
                    // Announce readiness to the global event system
                    console.log('Triggering graphReady event');
                    document.body.dispatchEvent(new CustomEvent('graphReady'));
                    
                    return true;
                    
                } catch (error) {
                    console.error('Error creating network:', error);
                    return false;
                }
            },
            
            // Reset all nodes to original state (optimized with batch update)
            resetHighlights: function() {
                if (!this.nodes) return;
                
                const allNodes = this.nodes.get();
                const nodesToUpdate = [];
                
                allNodes.forEach(node => {
                    const originalColor = this.originalNodeColors.get(node.id);
                    if (originalColor) {
                        nodesToUpdate.push({
                            id: node.id,
                            color: originalColor,
                            borderWidth: node.type === 'column' ? 2 : (node.type === 'dataset' ? 3 : 1)
                        });
                    }
                });
                
                // Single batch update instead of multiple individual updates
                if (nodesToUpdate.length > 0) {
                    this.nodes.update(nodesToUpdate);
                }
            },
            
            // Highlight a specific column (optimized for performance)
            highlightColumn: function(columnName) {
                if (!this.network || !this.nodes) {
                    console.error('Graph not initialized - network or nodes missing');
                    return false;
                }
                
                const startTime = performance.now();
                console.log('=== HIGHLIGHTING COLUMN ===', columnName);
                
                // Reset first (now uses batch update)
                this.resetHighlights();
                
                // Get all nodes once
                const allNodes = this.nodes.get();
                
                // Find matching column nodes efficiently
                const matchingColumnNodes = [];
                const allConnectedCellIds = new Set();
                
                // Single pass to find columns and collect connected cell IDs
                for (const node of allNodes) {
                    if (node.type === 'column' && node.column === columnName) {
                        matchingColumnNodes.push(node);
                        // Get connected nodes for this column
                        const connectedIds = this.network.getConnectedNodes(node.id);
                        connectedIds.forEach(id => allConnectedCellIds.add(id));
                    }
                }
                
                if (matchingColumnNodes.length === 0) {
                    console.warn(`No column nodes found for: ${columnName}`);
                    return false;
                }
                
                // Prepare batch updates
                const nodesToUpdate = [];
                const highlightedNodeIds = [];
                
                // Add column node updates
                matchingColumnNodes.forEach(columnNode => {
                    highlightedNodeIds.push(columnNode.id);
                    nodesToUpdate.push({
                        id: columnNode.id,
                        borderWidth: 5,
                        color: '#ff5733'
                    });
                });
                
                // Add connected cell updates in one pass
                allConnectedCellIds.forEach(nodeId => {
                    const node = allNodes.find(n => n.id === nodeId);
                    if (node && node.type === 'cell') {
                        nodesToUpdate.push({
                            id: nodeId,
                            color: '#ff9966',
                            borderWidth: 3
                        });
                    }
                });
                
                // Single batch update for all changes
                if (nodesToUpdate.length > 0) {
                    this.nodes.update(nodesToUpdate);
                }
                
                // Select and focus with reduced animation time
                if (highlightedNodeIds.length > 0) {
                    this.network.selectNodes(highlightedNodeIds);
                    
                    // Faster focus animation
                    this.network.focus(highlightedNodeIds[0], {
                        scale: 1.2,
                        animation: { duration: 400, easingFunction: 'easeInOutQuad' }
                    });
                }
                
                const endTime = performance.now();
                console.log(`✅ Highlighted ${highlightedNodeIds.length} nodes in ${(endTime - startTime).toFixed(2)}ms`);
                return true;
            },
            
            // Show node details
            showNodeDetails: function(node, nodeId) {
                const nodeDetailsContent = document.getElementById('node-details-content');
                if (!nodeDetailsContent) return;
                
                let detailsHTML = `
                    <div class="space-y-2">
                        <div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full" style="background-color: ${node.color}"></div>
                            <span class="font-medium">${node.label}</span>
                        </div>
                        <div class="p-2 bg-base-100 rounded border border-base-300">
                            <p><span class="font-semibold">Type:</span> ${node.type}</p>
                `;
                
                if (node.type === 'dataset') {
                    detailsHTML += `
                        <p><span class="font-semibold">Rows:</span> ${node.row_count || 'Unknown'}</p>
                        <p><span class="font-semibold">Columns:</span> ${node.column_count || 'Unknown'}</p>
                    `;
                } else if (node.type === 'cell') {
                    detailsHTML += `
                        <p><span class="font-semibold">Value:</span> ${node.value || ''}</p>
                    `;
                }
                
                detailsHTML += `
                        </div>
                        <div class="text-xs text-base-content/60 mt-2">
                            Node ID: ${nodeId}
                        </div>
                    </div>
                `;
                
                nodeDetailsContent.innerHTML = detailsHTML;
            },
            
            // Check if graph is ready
            isReady: function() {
                return !!(this.network && this.nodes && this.edges);
            }
        };
        
        // Auto-initialize when vis.js is available
        function initWhenReady() {
            if (typeof vis !== 'undefined') {
                console.log('Vis.js available, initializing graph...');
                const success = window.GraphAPI.init();
                
                if (success) {
                    // Initial highlighting if specified
                    {% if highlighted_column %}
                    setTimeout(() => window.GraphAPI.highlightColumn('{{ highlighted_column }}'), 500);
                    {% endif %}
                } else {
                    console.error('Graph initialization failed');
                    showGraphError('Graph initialization failed');
                }
            } else {
                // Check if vis.js script exists in the page
                const existingScript = document.querySelector('script[src*="vis-network"]');
                if (!existingScript) {
                    console.log('Vis.js script not found, loading dynamically...');
                    loadVisJSDynamically();
                } else {
                    console.log('Waiting for vis.js to load...');
                    // Keep checking but with a maximum number of attempts
                    if (!window.visLoadAttempts) window.visLoadAttempts = 0;
                    window.visLoadAttempts++;
                    
                    if (window.visLoadAttempts > 100) { // 10 seconds timeout
                        console.error('Vis.js failed to load after 10 seconds');
                        showGraphError('Failed to load graph library. Please refresh the page.');
                        return;
                    }
                    
                    setTimeout(initWhenReady, 100);
                }
            }
        }
        
        // Function to dynamically load vis.js
        function loadVisJSDynamically() {
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js';
            script.onload = function() {
                console.log('Vis.js loaded dynamically');
                setTimeout(initWhenReady, 100); // Small delay to ensure it's fully loaded
            };
            script.onerror = function() {
                console.error('Failed to load vis.js from CDN');
                showGraphError('Failed to load graph library from CDN. Please check your internet connection.');
            };
            document.head.appendChild(script);
            
            // Also load CSS if not present
            const existingCSS = document.querySelector('link[href*="vis-network"]');
            if (!existingCSS) {
                const link = document.createElement('link');
                link.href = 'https://unpkg.com/vis-network@9.1.2/dist/dist/vis-network.min.css';
                link.rel = 'stylesheet';
                link.type = 'text/css';
                document.head.appendChild(link);
            }
        }
        
        // Function to show error message in graph container
        function showGraphError(message) {
            const container = document.getElementById('graph-vis');
            if (container) {
                container.innerHTML = `
                    <div class="alert alert-error h-full flex items-center justify-center">
                        <div class="text-center">
                            <svg class="w-16 h-16 mx-auto mb-4 text-error" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <h3 class="font-bold text-lg mb-2">Graph Loading Error</h3>
                            <p class="text-sm">${message}</p>
                            <button class="btn btn-outline btn-sm mt-4" onclick="location.reload()">
                                <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                                Refresh Page
                            </button>
                        </div>
                    </div>
                `;
            }
        }
        
        // Start the initialization process
        initWhenReady();
    </script>
    {% endif %}
</div>

<!-- Graph container with simplified controls -->
<div class="card bg-base-100 shadow-lg border absolute bottom-4 right-4">
    <div class="card-body p-4">
        <h4 class="card-title text-sm mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4" />
            </svg>
            Graph Controls
        </h4>
        
        <div class="flex flex-col gap-2">
            <button class="btn btn-outline btn-sm" 
                    _="on click
                        log 'Reset highlights button clicked'
                        add .loading to me
                        trigger resetGraphHighlights
                        wait 100ms
                        remove .loading from me">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Reset Highlights
            </button>
            
            <button class="btn btn-primary btn-sm" 
                    _="on click
                        log 'Fit to view button clicked'
                        add .loading to me
                        if window.GraphAPI and window.GraphAPI.network
                            call window.GraphAPI.network.fit({
                                animation: { duration: 1000, easingFunction: 'easeInOutQuad' }
                            })
                        end
                        wait 200ms
                        remove .loading from me">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
                Fit to View
            </button>
            
            <button class="btn btn-accent btn-sm" 
                    _="on click
                        log 'Test highlight button clicked - simulating column click on body'
                        trigger highlightColumn(columnName: 'test') on body">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
                Test Highlight
            </button>
            
            <button class="btn btn-info btn-sm" 
                    _="on click
                        log 'Debug info requested'
                        if window.GraphAPI
                          log 'GraphAPI exists:', true
                          log 'GraphAPI.isReady():', window.GraphAPI.isReady()
                          if window.GraphAPI.nodes
                            log 'Total nodes:', window.GraphAPI.nodes.length
                            js
                              var columnNodes = window.GraphAPI.nodes.get().filter(n => n.type === 'column');
                              console.log('Column nodes:', columnNodes.length);
                              console.log('Available columns:', columnNodes.map(n => n.column));
                            end
                          else
                            log 'No nodes available'
                          end
                        else
                          log 'GraphAPI not found'
                        end">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Debug Info
            </button>
        </div>
        
        <!-- Stats -->
        <div class="stats stats-vertical shadow-inner bg-base-200 mt-3">
            <div class="stat py-2 px-3">
                <div class="stat-title text-xs">Nodes</div>
                <div class="stat-value text-sm">{{ nodes|length }}</div>
            </div>
            <div class="stat py-2 px-3">
                <div class="stat-title text-xs">Edges</div>
                <div class="stat-value text-sm">{{ edges|length|default:0 }}</div>
            </div>
        </div>
        
        <!-- Debug Info -->
        <div class="text-xs mt-2 p-2 bg-base-300 rounded">
            <div>Graph Ready: <span id="graph-status">No</span></div>
            <div>Nodes: <span id="node-count">0</span></div>
        </div>
    </div>
</div>
