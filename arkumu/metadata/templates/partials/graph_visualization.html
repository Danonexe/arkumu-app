<!-- Graph Visualization with DaisyUI Components -->
<div class="h-full flex flex-col">
    {% if error %}
    <div class="alert alert-error">
        <div class="flex-1">
            <svg class="w-6 h-6 mx-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <label>{{ error }}</label>
        </div>
    </div>
    {% else %}
    <div class="flex flex-row h-full gap-4">
        <!-- Graph visualization -->
        <div class="flex-1 h-full relative" id="graph-vis-container">
            <div id="graph-vis" class="h-full"></div>
        </div>
        
        <!-- Details panel -->
        <div class="w-64 bg-base-200 rounded-lg p-3 overflow-y-auto" id="node-details">
            <h3 class="text-sm font-semibold mb-2">Node Details</h3>
            <div id="node-details-content" class="text-xs">
                <p class="text-base-content/60">Click on a node to see details</p>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create the network visualization
            const container = document.getElementById('graph-vis');
            const nodeDetailsContent = document.getElementById('node-details-content');
            
            // Prepare the data
            const nodes = new vis.DataSet({{ graph_data.nodes|safe }});
            const edges = new vis.DataSet({{ graph_data.links|safe }});
            
            // Create the network
            const data = {
                nodes: nodes,
                edges: edges
            };
            
            // Configuration options
            const options = {
                nodes: {
                    shape: 'dot',
                    size: 16,
                    font: {
                        size: 12,
                        face: 'Roboto, system-ui, sans-serif'
                    },
                    borderWidth: 2,
                    shadow: true
                },
                edges: {
                    width: 1.5,
                    shadow: true,
                    smooth: {
                        type: 'continuous'
                    },
                    font: {
                        size: 10,
                        face: 'Roboto, system-ui, sans-serif',
                        align: 'middle'
                    }
                },
                physics: {
                    stabilization: true,
                    barnesHut: {
                        gravitationalConstant: -2000,
                        centralGravity: 0.1,
                        springLength: 150,
                        springConstant: 0.04,
                        damping: 0.09
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200,
                    navigationButtons: true,
                    keyboard: true
                }
            };
            
            // Initialize the network
            const network = new vis.Network(container, data, options);
            
            // Store a reference to the network on the container for external access
            container.__vis_network__ = network;
            
            // Handle click events to show node details
            network.on("click", function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = nodes.get(nodeId);
                    
                    // Update details panel
                    let detailsHTML = `
                        <div class="space-y-2">
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 rounded-full" style="background-color: ${node.color}"></div>
                                <span class="font-medium">${node.label}</span>
                            </div>
                            <div class="p-2 bg-base-100 rounded border border-base-300">
                                <p><span class="font-semibold">Type:</span> ${node.type}</p>
                    `;
                    
                    // Add different details based on node type
                    if (node.type === 'dataset') {
                        detailsHTML += `
                            <p><span class="font-semibold">Rows:</span> ${node.row_count || 'Unknown'}</p>
                            <p><span class="font-semibold">Columns:</span> ${node.column_count || 'Unknown'}</p>
                        `;
                    } else if (node.type === 'cell') {
                        detailsHTML += `
                            <p><span class="font-semibold">Value:</span> ${node.value || ''}</p>
                        `;
                    }
                    
                    detailsHTML += `
                            </div>
                            <div class="text-xs text-base-content/60 mt-2">
                                Node ID: ${nodeId}
                            </div>
                        </div>
                    `;
                    
                    nodeDetailsContent.innerHTML = detailsHTML;
                } else {
                    // No node selected
                    nodeDetailsContent.innerHTML = '<p class="text-base-content/60">Click on a node to see details</p>';
                }
            });
            
            // Highlight specific nodes if requested
            {% if highlighted_column %}
            const highlightedColumnId = 'column_{{ highlighted_column }}';
            network.selectNodes([highlightedColumnId]);
            network.focus(highlightedColumnId, {
                scale: 1.2,
                animation: {
                    duration: 1000,
                    easingFunction: 'easeInOutQuad'
                }
            });
            {% endif %}
            
            {% if highlighted_row %}
            const highlightedRowId = 'row_{{ highlighted_row }}';
            network.selectNodes([highlightedRowId], true); // true for append selection
            {% endif %}
        });
    </script>
    {% endif %}
</div>

<!-- Graph Controls using DaisyUI -->
<div class="card bg-base-100 shadow-lg border absolute bottom-4 right-4">
    <div class="card-body p-4">
        <h4 class="card-title text-sm mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4" />
            </svg>
            Graph Controls
        </h4>
        
        <div class="flex flex-col gap-2">
            <button class="btn btn-outline btn-sm" 
                    hx-post="/metadata/split-view/refresh-graph/"
                    hx-vals='{"source": "{{ source }}"}'
                    hx-target="#graph-container"
                    hx-swap="innerHTML"
                    hx-indicator=".htmx-indicator">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Refresh
            </button>
            
            <button class="btn btn-accent btn-sm" 
                    hx-post="/metadata/split-view/toggle-layout/"
                    hx-vals='{"source": "{{ source }}"}'
                    hx-target="#graph-container"
                    hx-swap="innerHTML"
                    hx-indicator=".htmx-indicator">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
                Layout
            </button>
        </div>
        
        <!-- Stats using DaisyUI stats -->
        <div class="stats stats-vertical shadow-inner bg-base-200 mt-3">
            <div class="stat py-2 px-3">
                <div class="stat-title text-xs">Nodes</div>
                <div class="stat-value text-sm">{{ nodes|length }}</div>
            </div>
            <div class="stat py-2 px-3">
                <div class="stat-title text-xs">Edges</div>
                <div class="stat-value text-sm">{{ edges|length|default:0 }}</div>
            </div>
        </div>
        
        <!-- Loading indicator -->
        <div class="htmx-indicator flex items-center justify-center mt-2">
            <span class="loading loading-spinner loading-sm"></span>
            <span class="ml-2 text-xs">Loading...</span>
        </div>
    </div>
</div>

<script>
// Enhanced HTMX interactions with DaisyUI
document.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.target && evt.detail.target.id === 'node-details') {
        // Remove previous highlights
        document.querySelectorAll('.card').forEach(card => {
            card.classList.remove('ring-2', 'ring-primary', 'ring-accent');
        });
        
        // Highlight selected node
        const nodeId = evt.detail.requestConfig.parameters.node_id;
        const selectedNode = document.querySelector(`[data-node-id="${nodeId}"]`);
        if (selectedNode) {
            selectedNode.classList.add('ring-2', 'ring-primary');
            
            // Highlight corresponding dataset in table
            const dataset = selectedNode.dataset.dataset;
            if (dataset) {
                highlightDatasetInTable(dataset);
            }
        }
    }
});

// Add loading states for better UX
document.addEventListener('htmx:beforeRequest', function(evt) {
    const trigger = evt.detail.elt;
    if (trigger.classList.contains('btn')) {
        trigger.classList.add('loading');
    }
});

document.addEventListener('htmx:afterRequest', function(evt) {
    const trigger = evt.detail.elt;
    if (trigger && trigger.classList.contains('btn')) {
        trigger.classList.remove('loading');
    }
});

function highlightDatasetInTable(datasetName) {
    const tables = document.querySelectorAll('#tables-container .card');
    tables.forEach(table => {
        table.classList.remove('ring-2', 'ring-accent');
        const title = table.querySelector('.card-title');
        if (title && title.textContent.trim() === datasetName) {
            table.classList.add('ring-2', 'ring-accent');
            table.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Auto-remove highlight
            setTimeout(() => {
                table.classList.remove('ring-2', 'ring-accent');
            }, 3000);
        }
    });
}
</script>
