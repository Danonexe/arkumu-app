{% for dataset in datasets %}
<div class="tree-node dataset"
     data-type="dataset"
     data-id="{{ dataset.id }}"
     data-loaded="false"
     hx-get="{% url 'metadata:tree_dataset' dataset.id %}"
     hx-target="next .tree-content"
     hx-trigger="click once"
     hx-swap="innerHTML"
     onclick="toggleTreeNode(this.querySelector('.tree-toggle'))"
     style="cursor: pointer;">
    <span class="tree-toggle">▶</span>
    <span class="tree-label">
        📁 {{ dataset.name }} 
        <span class="text-sm font-normal text-gray-600">({{ dataset.count }} items)</span>
        {% if dataset.source and dataset.source != "Unknown" %}
            <span class="source-badge">{{ dataset.source }}</span>
        {% endif %}
    </span>
</div>
<div class="tree-content collapsed">
    <span class="loading-spinner htmx-indicator"></span>
    <!-- Rows will be loaded here via HTMX -->
</div>
{% empty %}
<div class="text-gray-500 p-2">No more datasets in this source.</div>
{% endfor %}

{% if has_more %}
<div class="tree-node load-more"
     hx-get="{% url 'metadata:tree_bucket_more' bucket_name %}?offset={{ next_offset }}"
     hx-target="this"
     hx-swap="outerHTML"
     style="cursor: pointer; color: #3b82f6; font-style: italic; padding: 8px 12px;">
    <span style="margin-right: 8px;">⬇</span>
    <span>Load More Datasets...</span>
    <span class="loading-spinner htmx-indicator" style="margin-left: 8px;"></span>
</div>
{% endif %}
