<!-- Pure HTMX Column-Centric Mapping Builder -->
<div class="flex flex-col h-full" id="relationship-builder">

    <!-- Header -->
    <div class="flex justify-between items-center mb-2 flex-shrink-0">
        <h3 class="text-lg font-medium">
            Workspace
        </h3>
    </div>
    <div class="divider my-1 flex-shrink-0"></div>

    <!-- Selected Columns Workspace - This will be updated by HTMX -->
    <div id="selected-columns-workspace" class="flex-1 overflow-y-auto">
        {% include 'partials/selected_columns_workspace.html' with selected_columns=selected_columns active_datasets=active_datasets datasets=datasets organization_id=organization_id datasets_json=datasets_json csrf_token=csrf_token %}
    </div>

</div>

<!-- Modal containers -->
<div id="dataset-columns-modal"></div>

<!-- Simplified Toast System -->
<div id="toast-container" class="toast toast-top toast-end"></div>

<!-- Minimal custom CSS -->
<style>
/* Only essential custom styles that DaisyUI doesn't provide */
.collapse-title .btn {
    pointer-events: auto; /* Prevent close button from triggering collapse */
}
</style>
