<!-- Relationship Builder Panel -->
<div class="flex flex-col h-full" 
     _="on load
        -- Initialize relationship tracking variables
        if $selectedColumn1 is undefined then set $selectedColumn1 to null end
        if $selectedColumn2 is undefined then set $selectedColumn2 to null end
        if $activeRelationships is undefined then set $activeRelationships to [] end
        log 'Relationship builder initialized'">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-medium">
            <span class="text-primary">Dataset</span> Relationships
        </h3>
        <div class="badge badge-primary badge-outline badge-sm">Phase 1</div>
    </div>
    <div class="divider my-0"></div>

    <!-- Loaded Datasets Section -->
    <div class="mb-4">
        <h4 class="text-sm font-medium mb-2 flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
            </svg>
            Loaded Datasets
            <span id="loaded-dataset-count" class="badge badge-xs badge-info">0</span>
        </h4>
        
        <div id="loaded-datasets-list" class="space-y-2">
            <!-- This will be populated by hyperscript when datasets are loaded -->
            <div class="text-center py-4 text-base-content opacity-50 text-sm">
                No datasets loaded yet
            </div>
        </div>
    </div>

    <!-- Column Selection Section -->
    <div class="mb-4">
        <h4 class="text-sm font-medium mb-2 flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Selected Columns
        </h4>
        
        <div class="space-y-2">
            <!-- First Column Selection -->
            <div class="card bg-base-200 p-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-medium opacity-70">Column A:</span>
                    <button class="btn btn-xs btn-ghost opacity-50" 
                            id="clear-column1-btn"
                            style="display: none;"
                            _="on click
                               set $selectedColumn1 to null
                               put 'Select a column...' into #selected-column1-display
                               hide me
                               call updateLinkButton()">
                        ×
                    </button>
                </div>
                <div id="selected-column1-display" class="text-sm mt-1 text-base-content opacity-60">
                    Select a column...
                </div>
            </div>

            <!-- Second Column Selection -->
            <div class="card bg-base-200 p-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-medium opacity-70">Column B:</span>
                    <button class="btn btn-xs btn-ghost opacity-50" 
                            id="clear-column2-btn"
                            style="display: none;"
                            _="on click
                               set $selectedColumn2 to null
                               put 'Select a column...' into #selected-column2-display
                               hide me
                               call updateLinkButton()">
                        ×
                    </button>
                </div>
                <div id="selected-column2-display" class="text-sm mt-1 text-base-content opacity-60">
                    Select a column...
                </div>
            </div>

            <!-- Link Button -->
            <button class="btn btn-sm btn-success w-full gap-2" 
                    id="link-columns-btn"
                    style="display: none;"
                    _="on click
                       if $selectedColumn1 and $selectedColumn2
                           -- Create relationship object
                           js(me, $selectedColumn1, $selectedColumn2, $activeRelationships)
                               const relationship = {
                                   id: Date.now(),
                                   column1: $selectedColumn1,
                                   column2: $selectedColumn2,
                                   type: 'basic_link',
                                   created: new Date().toLocaleTimeString()
                               };
                               $activeRelationships.push(relationship);
                               return relationship;
                           end
                           set newRelationship to the result
                           
                           log 'Created relationship:', newRelationship
                           
                           -- Clear selections
                           set $selectedColumn1 to null
                           set $selectedColumn2 to null
                           put 'Select a column...' into #selected-column1-display
                           put 'Select a column...' into #selected-column2-display
                           hide #clear-column1-btn
                           hide #clear-column2-btn
                           hide #link-columns-btn
                           
                           -- Update relationships display
                           call updateRelationshipsList()
                           
                           -- Show success toast
                           set toastMsg to 'Linked ' + newRelationship.column1.dataset + '.' + newRelationship.column1.name + ' ↔ ' + newRelationship.column2.dataset + '.' + newRelationship.column2.name
                           send showToast(message: toastMsg, type: 'success') to body
                       end">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                </svg>
                Link Columns
            </button>
        </div>
    </div>

    <!-- Active Relationships Section -->
    <div class="flex-1 overflow-y-auto">
        <h4 class="text-sm font-medium mb-2 flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
            Active Relationships
            <span id="relationships-count" class="badge badge-xs badge-success">0</span>
        </h4>
        
        <div id="relationships-list" class="space-y-2">
            <div class="text-center py-8 text-base-content opacity-50 text-sm">
                <svg class="w-12 h-12 mx-auto mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                </svg>
                No relationships created yet
                <div class="text-xs mt-1 opacity-70">Select two columns to create a link</div>
            </div>
        </div>
    </div>
</div>

<!-- Hyperscript Functions -->
<script type="text/hyperscript">
    -- Function to update the link button visibility
    def updateLinkButton()
        if $selectedColumn1 and $selectedColumn2 then
            show #link-columns-btn
        else
            hide #link-columns-btn
        end
    end

    -- Function to update relationships list display
    def updateRelationshipsList()
        if $activeRelationships.length > 0 then
            set html to ''
            repeat for relationship in $activeRelationships
                -- Build relationship HTML using string concatenation
                set relationshipHtml to '<div class="card bg-base-100 border border-base-300 p-3">'
                set relationshipHtml to relationshipHtml + '<div class="flex items-start justify-between">'
                set relationshipHtml to relationshipHtml + '<div class="flex-1">'
                set relationshipHtml to relationshipHtml + '<div class="text-sm font-medium">'
                set relationshipHtml to relationshipHtml + '<span class="text-primary">' + relationship.column1.dataset + '</span>'
                set relationshipHtml to relationshipHtml + '.<span class="text-info">' + relationship.column1.name + '</span>'
                set relationshipHtml to relationshipHtml + '<span class="mx-2 text-base-content opacity-50">↔</span>'
                set relationshipHtml to relationshipHtml + '<span class="text-primary">' + relationship.column2.dataset + '</span>'
                set relationshipHtml to relationshipHtml + '.<span class="text-info">' + relationship.column2.name + '</span>'
                set relationshipHtml to relationshipHtml + '</div>'
                set relationshipHtml to relationshipHtml + '<div class="text-xs text-base-content opacity-60 mt-1">'
                set relationshipHtml to relationshipHtml + 'Created: ' + relationship.created
                set relationshipHtml to relationshipHtml + '</div></div>'
                set relationshipHtml to relationshipHtml + '<button class="btn btn-xs btn-ghost btn-circle text-error hover:bg-error hover:text-error-content" title="Remove relationship" data-rel-id="' + relationship.id + '"'
                set relationshipHtml to relationshipHtml + ' _="on click js(me, $activeRelationships) const relationshipId = parseInt(me.getAttribute(\'data-rel-id\')); const index = $activeRelationships.findIndex(r => r.id === relationshipId); if (index > -1) { $activeRelationships.splice(index, 1); } end call updateRelationshipsList() send showToast(message: \'Relationship removed\', type: \'info\') to body">'
                set relationshipHtml to relationshipHtml + '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">'
                set relationshipHtml to relationshipHtml + '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>'
                set relationshipHtml to relationshipHtml + '</svg></button></div></div>'
                
                set html to html + relationshipHtml
            end
            put html into #relationships-list
            put $activeRelationships.length into #relationships-count
        else
            put '<div class="text-center py-8 text-base-content opacity-50 text-sm"><svg class="w-12 h-12 mx-auto mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>No relationships created yet<div class="text-xs mt-1 opacity-70">Select two columns to create a link</div></div>' into #relationships-list
            put '0' into #relationships-count
        end
    end

    -- Function to handle column selection from dataset cards
    def handleColumnSelection(columnData)
        if not $selectedColumn1 then
            set $selectedColumn1 to columnData
            put columnData.dataset + '.' + columnData.name into #selected-column1-display
            show #clear-column1-btn
        else if not $selectedColumn2 and columnData.dataset + '.' + columnData.name != $selectedColumn1.dataset + '.' + $selectedColumn1.name then
            set $selectedColumn2 to columnData
            put columnData.dataset + '.' + columnData.name into #selected-column2-display
            show #clear-column2-btn
        else
            -- Replace first selection if trying to select same column or third column
            set $selectedColumn1 to columnData
            put columnData.dataset + '.' + columnData.name into #selected-column1-display
            show #clear-column1-btn
            
            -- Clear second selection
            set $selectedColumn2 to null
            put 'Select a column...' into #selected-column2-display
            hide #clear-column2-btn
        end
        
        call updateLinkButton()
    end

    -- Function to update loaded datasets display
    def updateLoadedDatasetsList()
        if $loadedDatasets and $loadedDatasets.length > 0 then
            set html to ''
            repeat for datasetKey in $loadedDatasets
                js(datasetKey) return datasetKey.split('::'); end
                set parts to the result
                set source to parts[0]
                set dataset to parts[1]
                
                set datasetHtml to '<div class="flex items-center gap-2 p-2 bg-base-100 rounded border border-base-300">'
                set datasetHtml to datasetHtml + '<div class="avatar placeholder">'
                set datasetHtml to datasetHtml + '<div class="bg-primary text-primary-content rounded w-6 h-6">'
                set datasetHtml to datasetHtml + '<svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">'
                set datasetHtml to datasetHtml + '<path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4z"/>'
                set datasetHtml to datasetHtml + '</svg></div></div>'
                set datasetHtml to datasetHtml + '<div class="flex-1 min-w-0">'
                set datasetHtml to datasetHtml + '<div class="text-sm font-medium truncate">' + dataset + '</div>'
                set datasetHtml to datasetHtml + '<div class="text-xs text-base-content opacity-60 truncate">' + source + '</div>'
                set datasetHtml to datasetHtml + '</div></div>'
                
                set html to html + datasetHtml
            end
            put html into #loaded-datasets-list
            put $loadedDatasets.length into #loaded-dataset-count
        else
            put '<div class="text-center py-4 text-base-content opacity-50 text-sm">No datasets loaded yet</div>' into #loaded-datasets-list
            put '0' into #loaded-dataset-count
        end
    end
</script>
