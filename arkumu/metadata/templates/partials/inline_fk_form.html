<!-- Inline FK Configuration Form -->
<div id="fk-form-{{ column.id }}" class="ml-6 mt-2 p-3 border border-base-300 rounded-lg bg-base-50">
    <form hx-post="{% url 'metadata:save_inline_fk_config' %}"
          hx-target="#selected-columns-workspace"
          hx-swap="innerHTML">
        {% csrf_token %}
        <input type="hidden" name="column_id" value="{{ column.id }}">
        
        <div class="space-y-3">
            <div class="text-sm font-medium text-base-content">Configure Foreign Key for: {{ column.name }}</div>
            
            <!-- Direction Selection -->
            <div class="form-control">
                <label class="label label-text text-xs">Relationship Direction:</label>
                <div class="flex gap-2">
                    <label class="label cursor-pointer">
                        <span class="label-text text-xs mr-2">Outbound (this → target)</span>
                        <input type="radio" name="fk_direction" value="outbound" 
                               class="radio radio-xs radio-secondary" 
                               {% if current_direction == 'outbound' or not current_direction %}checked{% endif %}>
                    </label>
                    <label class="label cursor-pointer">
                        <span class="label-text text-xs mr-2">Inbound (target → this)</span>
                        <input type="radio" name="fk_direction" value="inbound" 
                               class="radio radio-xs radio-secondary"
                               {% if current_direction == 'inbound' %}checked{% endif %}>
                    </label>
                </div>
            </div>
            
            <!-- Target Dataset Selection -->
            <div class="form-control">
                <label class="label label-text text-xs">Target Dataset:</label>
                <select name="target_dataset" class="select select-xs select-bordered" 
                        hx-post="{% url 'metadata:update_fk_target_columns' %}"
                        hx-vals='{"column_id": "{{ column.id }}", "organization_id": "{{ organization_id }}", "datasets": "{{ datasets|escapejs }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                        hx-include="[name='target_dataset']"
                        hx-target="#target-column-select-{{ column.id }}"
                        hx-swap="innerHTML"
                        hx-trigger="change">
                    <option value="">Select target dataset...</option>
                    {% for dataset in datasets %}
                        {% if dataset.name != column.dataset %}
                        <option value="{{ dataset.name }}" {% if dataset.name == target_dataset %}selected{% endif %}>
                            {{ dataset.name }} ({{ dataset.source }})
                        </option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
            
            <!-- Target Column Selection -->
            <div class="form-control">
                <label class="label label-text text-xs">Target Column:</label>
                <select name="target_column" id="target-column-select-{{ column.id }}" class="select select-xs select-bordered">
                    <option value="">Select target column...</option>
                    {% if target_dataset %}
                        {% for dataset in datasets %}
                            {% if dataset.name == target_dataset %}
                                {% for column_name in dataset.preview.colHeaders %}
                                <option value="{{ column_name }}" {% if column_name == target_column %}selected{% endif %}>
                                    {{ column_name }}
                                </option>
                                {% endfor %}
                            {% endif %}
                        {% endfor %}
                    {% endif %}
                </select>
            </div>
            
            <!-- Action Buttons -->
            <div class="flex gap-2 justify-end">
                <button type="button" class="btn btn-xs btn-ghost" 
                        hx-get="{% url 'metadata:hide_fk_form' %}?column_id={{ column.id }}"
                        hx-target="#fk-form-{{ column.id }}"
                        hx-swap="outerHTML">
                    Cancel
                </button>
                {% if column.is_fk %}
                <button type="button" class="btn btn-xs btn-error btn-outline" 
                        hx-post="{% url 'metadata:remove_fk_config' %}"
                        hx-vals='{"column_id": "{{ column.id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                        hx-target="#selected-columns-workspace"
                        hx-swap="innerHTML">
                    Remove FK
                </button>
                {% endif %}
                <button type="submit" class="btn btn-xs btn-secondary">Save FK</button>
            </div>
        </div>
    </form>
</div>
