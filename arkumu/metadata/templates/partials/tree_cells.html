{% for cell in cells %}
<div class="tree-node cell" 
     data-type="cell" 
     data-id="{{ cell.id }}"
     hx-get="{% url 'metadata:graph_data' %}?level=cell&cell={{ cell.id }}&dataset={{ dataset_id }}&row={{ row_id }}"
     hx-target="#graph-content"
     hx-swap="innerHTML">
    <span class="tree-toggle"> </span>
    <span class="tree-label">{{ cell.name }}</span>
</div>
{% empty %}
<div class="text-gray-500 text-sm">No cells found</div>
{% endfor %}
