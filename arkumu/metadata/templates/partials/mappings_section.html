<!-- Created Mappings Section -->
<div id="mappings-section" class="pt-2 mt-2">
    <h4 class="text-sm font-medium mb-3 flex items-center gap-2">
    
        
        {% if mappings %}
        <div class="ml-auto flex gap-2">
            <button class="btn btn-xs btn-ghost" 
                    title="Export mappings"
                    onclick="window.location.href='{% url 'metadata:export_mappings' %}'"
                    title="Download mappings as JSON">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Export
            </button>
            <button class="btn btn-xs btn-ghost text-error" 
                    title="Clear all mappings"
                    disabled
                    title="Clear all feature coming soon">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                Clear All
            </button>
        </div>
        {% endif %}
    </h4>

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                </svg>
                <p>No mappings created yet</p>
                <p class="text-xs mt-1 opacity-70">Select columns and create relationships</p>
            </div>
        {% endif %}
    </div> -->
    
    <!-- Quick Stats (if mappings exist) -->
    {% if mappings %}
    <div class="mt-3 pt-3 border-t border-base-300">
        <div class="grid grid-cols-3 gap-4 text-center text-xs">
            <div>
                <div class="font-medium">{{ mappings|length }}</div>
                <div class="text-base-content opacity-50">Total</div>
            </div>
            <div>
                <div class="font-medium">{{ unique_datasets_count }}</div>
                <div class="text-base-content opacity-50">Datasets</div>
            </div>
            <div>
                <div class="font-medium">{{ relationship_types_count }}</div>
                <div class="text-base-content opacity-50">Types</div>
            </div>
        </div>
    </div>
    {% endif %}
</div>

<!-- Modal container for mapping details -->
<div id="mapping-details-modal"></div>

<!-- Export modal container -->
<div id="export-modal"></div>
