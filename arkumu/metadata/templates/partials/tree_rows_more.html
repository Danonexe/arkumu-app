{% for row in rows %}
<div class="tree-node row" 
     data-type="row" 
     data-id="{{ row.id }}"
     data-loaded="false"
     hx-get="{% url 'metadata:tree_row' dataset_id row.id %}"
     hx-target="next .tree-content"
     hx-trigger="click once"
     hx-swap="innerHTML"
     onclick="toggleTreeNode(this.querySelector('.tree-toggle'))"
     style="cursor: pointer;">
    <span class="tree-toggle">▶</span>
    <span class="tree-label">{{ row.name }} ({{ row.count }})</span>
</div>
<div class="tree-content collapsed">
    <span class="loading-spinner htmx-indicator"></span>
    <!-- Cells will be loaded here via HTMX -->
</div>
{% endfor %}

{% if has_more %}
<div class="tree-node load-more"
     hx-get="{% url 'metadata:tree_dataset_more' dataset_id %}?offset={{ next_offset }}"
     hx-target="this"
     hx-swap="outerHTML"
     style="cursor: pointer; color: #3b82f6; font-style: italic; padding: 8px 12px;">
    <span style="margin-right: 8px;">⬇</span>
    <span>Load More Rows...</span>
    <span class="loading-spinner htmx-indicator" style="margin-left: 8px;"></span>
</div>
{% endif %}
