<!-- Smart Mapping Creation Form -->
<div class="pt-3 mt-3 border-t border-base-200" id="smart-mapping-form">
    {% if selected_columns %}
        <h4 class="text-sm font-medium mb-3 flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
            Create Mapping from Selected Columns
            <span class="badge badge-info badge-xs">{{ selected_columns|length }} columns</span>
        </h4>

        <form hx-post="{% url 'metadata:create_mapping' %}"
              hx-target="#mappings-section"
              hx-swap="innerHTML"
              hx-indicator="#mapping-spinner"
              class="space-y-4">
            
            {% csrf_token %}
            
            <!-- Auto-populated from context -->
            <input type="hidden" name="selected_columns_context" value="{{ selected_columns|length }}">
            {% if anchor_column %}
            <input type="hidden" name="anchor_column_id" value="{{ anchor_column.id }}">
            {% endif %}
            
            <!-- Basic Mapping Info -->
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="label">
                        <span class="label-text text-xs font-medium">Mapping Name</span>
                    </label>
                    <input type="text" 
                           name="mapping_name" 
                           id="smart-mapping-name"
                           placeholder="Auto-generated based on selection..."
                           class="input input-sm input-bordered w-full" 
                           required>
                </div>
            </div>

            <!-- Mapping Type Selection -->
            <div>
                <label class="label">
                    <span class="label-text text-xs font-medium">Mapping Type</span>
                </label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <label class="cursor-pointer">
                        <input type="radio" 
                               name="mapping_type" 
                               value="entity" 
                               class="radio radio-primary radio-sm"
                               hx-get="{% url 'metadata:mapping_config' %}?type=entity{% if anchor_column %}&anchor_column={{ anchor_column.id }}{% endif %}"
                               hx-target="#mapping-config-container"
                               hx-trigger="change"
                               required>
                        <span class="label-text ml-2 text-xs">Entity</span>
                        <div class="text-xs text-base-content opacity-60">Row → Entity</div>
                    </label>
                    
                    <label class="cursor-pointer">
                        <input type="radio" 
                               name="mapping_type" 
                               value="lookup" 
                               class="radio radio-secondary radio-sm"
                               hx-get="{% url 'metadata:mapping_config' %}?type=lookup{% if anchor_column %}&anchor_column={{ anchor_column.id }}{% endif %}"
                               hx-target="#mapping-config-container"
                               hx-trigger="change">
                        <span class="label-text ml-2 text-xs">Lookup</span>
                        <div class="text-xs text-base-content opacity-60">FK → References</div>
                    </label>
                    
                    <label class="cursor-pointer">
                        <input type="radio" 
                               name="mapping_type" 
                               value="vocabulary" 
                               class="radio radio-accent radio-sm"
                               hx-get="{% url 'metadata:mapping_config' %}?type=vocabulary{% if anchor_column %}&anchor_column={{ anchor_column.id }}{% endif %}"
                               hx-target="#mapping-config-container"
                               hx-trigger="change">
                        <span class="label-text ml-2 text-xs">Vocabulary</span>
                        <div class="text-xs text-base-content opacity-60">Multi-value → Terms</div>
                    </label>
                    
                    <label class="cursor-pointer">
                        <input type="radio" 
                               name="mapping_type" 
                               value="junction" 
                               class="radio radio-info radio-sm"
                               hx-get="{% url 'metadata:mapping_config' %}?type=junction{% if anchor_column %}&anchor_column={{ anchor_column.id }}{% endif %}"
                               hx-target="#mapping-config-container"
                               hx-trigger="change">
                        <span class="label-text ml-2 text-xs">Junction</span>
                        <div class="text-xs text-base-content opacity-60">Table → Relationships</div>
                    </label>
                </div>
            </div>

        <!-- Dynamic Configuration Container (HTMX Target) -->
        <div id="mapping-config-container">
            <!-- Configuration sections will be loaded here via HTMX -->
        </div>

            <!-- Submit Button -->
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" 
                        class="btn btn-sm btn-ghost"
                        hx-get="{% url 'metadata:mapping_config' %}?type=reset{% if anchor_column %}&anchor_column={{ anchor_column.id }}{% endif %}"
                        hx-target="#mapping-config-container"
                        onclick="this.closest('form').reset();">
                    Cancel
                </button>
                <button type="submit" 
                        class="btn btn-sm btn-primary">
                    <span id="mapping-spinner" class="loading loading-spinner loading-xs htmx-indicator"></span>
                    Create Mapping
                </button>
            </div>
        </form>
    {% else %}
        <div class="text-center py-8 text-base-content opacity-50">
            <svg class="w-12 h-12 mx-auto mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
            </svg>
            <p class="text-sm">Select columns above to create mappings</p>
        </div>
    {% endif %}
</div>
