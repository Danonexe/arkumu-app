<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
    <div class="form-control">
        <label class="label">
            <span class="label-text">Available Datasets</span>
            <span class="label-text-alt">Choose dataset to transform</span>
        </label>
        <select id="dataset-selector" name="dataset_uri" class="select select-bordered">
            <option value="">Select a dataset...</option>
            {% for dataset in datasets %}
                <option value="{{ dataset.uri }}">{{ dataset.name|default:dataset.uri }} ({{ dataset.source }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-control">
        <label class="label">
            <span class="label-text">Institution/Source</span>
            <span class="label-text-alt">Filter by source</span>
        </label>
        <select id="institution-filter" name="institution" class="select select-bordered"
                hx-get="{% url 'metadata:list_datasets' %}"
                hx-target="#dataset-selector-container"
                hx-trigger="change">
            <option value="">All institutions...</option>
            {% for institution in institutions %}
                <option value="{{ institution }}" {% if institution == selected_institution %}selected{% endif %}>
                    {{ institution }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>

<!-- Dataset Info Display -->
<div id="dataset-info" class="mb-4">
    {% if datasets %}
        <div class="alert alert-info">
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <div>
                <h4 class="font-bold">{{ datasets|length }} dataset{{ datasets|length|pluralize }} available</h4>
                <div class="text-sm">Select a dataset above to enable transformation options</div>
            </div>
        </div>
    {% else %}
        <div class="alert alert-warning">
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L2.732 16.5c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
            <span>No datasets found. Please import some data first.</span>
        </div>
    {% endif %}
