{% for bucket in buckets %}
<div class="tree-node bucket" 
     data-type="bucket" 
     data-id="{{ bucket.name }}"
     data-loaded="false"
     hx-get="{% url 'metadata:tree_bucket_content' bucket.name %}"
     hx-target="next .tree-content"
     hx-trigger="click once"
     hx-swap="innerHTML"
     onclick="toggleTreeNode(this.querySelector('.tree-toggle'))"
     style="cursor: pointer;">
    <span class="tree-toggle">▶</span>
    <span class="tree-label">📦 {{ bucket.name }} ({{ bucket.dataset_count }} datasets)</span>
</div>
<div class="tree-content collapsed">
    <span class="loading-spinner htmx-indicator"></span>
    <!-- Datasets will be loaded here via HTMX -->
</div>
{% empty %}
<div class="text-gray-500 p-4">No buckets found</div>
{% endfor %}
