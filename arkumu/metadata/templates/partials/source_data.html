<!--
This template uses HTMX's Out-of-Band swap feature.
It returns two main blocks that will be swapped into the appropriate containers
on the main split_table_graph.html page.
-->

<!--
This block will replace the content of #table-content
-->
<div id="table-content" hx-swap-oob="innerHTML" class="h-full overflow-auto">
    <div class="p-4 space-y-4">
    {% if datasets %}
        {% for dataset in datasets %}
            {% include "partials/dataset_card.html" %}
        {% endfor %}
    {% else %}
        <div class="hero h-full">
            <div class="hero-content text-center">
                <div class="max-w-md">
                    <svg class="w-16 h-16 mx-auto mb-4 text-base-content/30" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
                    </svg>
                    <h3 class="text-xl font-bold text-base-content/60">No Datasets Found</h3>
                    <p class="py-2 text-base-content/40">This source doesn't contain any processable datasets.</p>
                </div>
            </div>
        </div>
    {% endif %}
    </div>
</div>

<!--
This block will replace the content of #graph-content
-->
<div id="graph-content" hx-swap-oob="innerHTML" class="h-full max-h-[500px] overflow-hidden">
    <div class="hero h-full">
        <div class="hero-content text-center">
            <div class="max-w-md">
                <svg class="w-16 h-16 mx-auto mb-4 text-base-content/30" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
                </svg>
                <h3 class="text-xl font-bold">Select a Dataset</h3>
                <p class="text-base-content/50">Click a dataset on the left to view its graph.</p>
            </div>
        </div>
    </div>
</div>

<!-- The primary response content is empty. This is intentional. -->
