<!-- Split View Content for {{ source }} -->
<div class="grid grid-cols-2 gap-4 h-screen max-h-screen">
    <!-- Left Panel - Tables Dashboard -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-0">
            <div class="flex items-center justify-between p-4 border-b">
                <h2 class="card-title">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z" />
                    </svg>
                    {{ source }} - Tables
                </h2>
                <div class="badge badge-info">{{ datasets|length }} dataset{{ datasets|length|pluralize }}</div>
            </div>
            <div class="flex-1 relative overflow-auto">
                <div class="w-full h-full p-4 space-y-4" id="tables-container">
                    {% for dataset in datasets %}
                        {% include "partials/dataset_card.html" %}
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
    
    <!-- Right Panel - Graph View -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-0">
            <div class="flex items-center justify-between p-4 border-b">
                <h2 class="card-title">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7l7 7-7 7" />
                    </svg>
                    Graph View
                </h2>
                <div class="badge badge-outline" id="graph-node-count">Select dataset</div>
            </div>
            <div class="flex-1 relative overflow-auto bg-base-200">
                <div class="graph-container w-full h-full relative p-4" id="graph-container">
                    <!-- Empty state - graph loads on demand -->
                    <div class="hero h-full">
                        <div class="hero-content text-center">
                            <div class="max-w-md">
                                <div class="text-6xl mb-4">📊</div>
                                <h1 class="text-2xl font-bold text-base-content/60">Select a Dataset</h1>
                                <p class="py-2 text-base-content/40">Click on a dataset table to view its graph visualization</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
