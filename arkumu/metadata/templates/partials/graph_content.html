{% if error %}
<div class="flex items-center justify-center h-full">
    <div class="text-center">
        <div class="text-red-500 mb-2">
            <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
            </svg>
        </div>
        <p class="text-gray-600">{{ error }}</p>
    </div>
</div>
{% else %}
<!-- Debug info -->
<div class="mb-2 text-xs text-gray-500">
    Level: {{ level }}, Dataset: {{ dataset_id }}, Row: {{ row_id }}, Cell: {{ cell_id }}
</div>

<svg id="triple-graph" class="w-full h-full"></svg>

<!-- Embed the graph data as JSON in a script tag -->
<script id="htmx-graph-data" type="application/json">{{ graph_data|safe }}</script>

<script>
// Render the graph immediately when this content loads
(function() {
    console.log('HTMX content loaded, attempting to render graph...');
    
    const graphDataElement = document.getElementById('htmx-graph-data');
    if (!graphDataElement) {
        console.error('Graph data element not found');
        return;
    }
    
    let graphData;
    try {
        graphData = JSON.parse(graphDataElement.textContent);
        console.log('Parsed graph data:', graphData);
    } catch (e) {
        console.error('Error parsing graph data:', e);
        return;
    }
    
    // Check if renderGraph function exists
    if (typeof renderGraph !== 'function') {
        console.error('renderGraph function not found in global scope');
        // Show a message in the SVG
        const svg = document.getElementById('triple-graph');
        if (svg) {
            svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="red">renderGraph function not found</text>';
        }
        return;
    }
    
    // Small delay to ensure DOM is ready
    setTimeout(function() {
        console.log('Calling renderGraph with data:', graphData);
        try {
            renderGraph(graphData);
            console.log('Graph rendered successfully');
        } catch (e) {
            console.error('Error calling renderGraph:', e);
            const svg = document.getElementById('triple-graph');
            if (svg) {
                svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="red">Error rendering graph: ' + e.message + '</text>';
            }
        }
    }, 100);
})();
</script>
{% endif %}
