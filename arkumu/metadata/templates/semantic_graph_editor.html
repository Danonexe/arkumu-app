{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Dataset Graph Explorer</h1>
        <div class="flex gap-2">
            <a href="{% url 'metadata:graph_connections' %}" class="btn btn-outline btn-sm">List View</a>
            <a href="{% url 'metadata:metadata_dashboard' %}" class="btn btn-ghost">← Back</a>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 h-[calc(100vh-200px)]">
        <!-- Graph Visualization -->
        <div class="lg:col-span-3 bg-base-100 shadow rounded-lg">
            <div class="p-4 border-b">
                <div class="flex justify-between items-center">
                    <h2 class="font-semibold">Connection Tree</h2>
                    <div class="flex gap-2">
                        <button onclick="fitTree()" class="btn btn-xs btn-outline">Fit</button>
                        <button onclick="resetTree()" class="btn btn-xs btn-outline">Reset</button>
                        <button onclick="zoomIn()" class="btn btn-xs btn-outline">+</button>
                        <button onclick="zoomOut()" class="btn btn-xs btn-outline">-</button>
                    </div>
                </div>
                <p class="text-sm text-gray-600 mt-1">Click nodes to expand connections • Drag to pan • Scroll to zoom</p>
            </div>
            <div id="tree-container" class="w-full h-full overflow-auto">
                <svg id="tree-svg" width="100%" height="100%"></svg>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="bg-base-100 shadow rounded-lg p-4 h-full overflow-hidden flex flex-col">
            <h2 class="font-semibold mb-3">Node Info</h2>
            <div id="node-info" class="space-y-3 flex-1 overflow-y-auto" hx-swap="innerHTML">
                <p class="text-gray-500 text-sm">Click a node to see details</p>
            </div>
        </div>
    </div>

    <!-- Hidden HTMX target for loading data -->
    <div id="htmx-target" style="display: none;"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>

<script>
let svg, g, tree, root, zoom;
let expandedNodes = new Set();
let nodeCounter = 0;
let isLoading = false; // Prevent concurrent requests

const margin = {top: 40, right: 120, bottom: 200, left: 120};
const width = 1200 - margin.left - margin.right;
const height = 800 - margin.top - margin.bottom;

document.addEventListener('DOMContentLoaded', function() {
    initializeTree();
    loadInitialDatasets();
});

function initializeTree() {
    svg = d3.select("#tree-svg")
        .attr("width", "100%")
        .attr("height", "100%")
        .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`);
    
    // Add zoom behavior
    zoom = d3.zoom()
        .scaleExtent([0.1, 3])
        .on("zoom", function(event) {
            g.attr("transform", event.transform);
        });
    
    svg.call(zoom);
    
    g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);
    
    tree = d3.tree()
        .size([width, height])
        .nodeSize([200, 80]) // Set minimum spacing between nodes (horizontal, vertical)
        .separation((a, b) => {
            // Increase separation based on depth and relationship
            const baseSeparation = a.parent == b.parent ? 1.2 : 2;
            return baseSeparation;
        });
    
    root = d3.hierarchy({
        id: 'root',
        name: 'Datasets',
        type: 'root',
        children: []
    });
    
    root.x0 = width / 2;
    root.y0 = 0;
    
    updateTree();
}

function loadInitialDatasets() {
    htmx.ajax('GET', '{% url "metadata:get_datasets_htmx" %}', {
        target: '#htmx-target',
        swap: 'innerHTML'
    }).then(function() {
        parseDatasets();
    });
}

function parseDatasets() {
    const container = document.getElementById('htmx-target');
    const datasetDivs = container.querySelectorAll('[hx-get*="dataset"][hx-get*="columns"]');
    console.log('Found dataset divs:', datasetDivs.length);
    
    root.data.children = [];
    
    datasetDivs.forEach(div => {
        const url = div.getAttribute('hx-get');
        const datasetId = url.match(/dataset\/([^/]+)\/columns/)[1];
        const name = div.querySelector('.font-medium').textContent;
        const columnCount = div.querySelector('.text-gray-500').textContent;
        
        root.data.children.push({
            id: `dataset-${datasetId}`,
            name: name,
            details: columnCount,
            type: 'dataset',
            datasetId: datasetId,
            children: []
        });
    });
    
    root = d3.hierarchy(root.data);
    root.x0 = width / 2;
    root.y0 = 0;
    
    // Expand the root node by default to show datasets
    if (root.children) {
        expandedNodes.add('root');
    }
    
    updateTree();
}

function updateTree() {
    const treeData = tree(root);
    const nodes = treeData.descendants();
    const links = treeData.descendants().slice(1);
    
    // Update nodes
    const node = g.selectAll('.node')
        .data(nodes, d => d.data.id || (d.data.id = `node-${++nodeCounter}`));
    
    const nodeEnter = node.enter().append('g')
        .attr('class', 'node')
        .attr('transform', d => {
            if (d.parent) {
                return `translate(${d.parent.x0 || 0},${d.parent.y0 || 0})`;
            }
            return `translate(${root.x0},${root.y0})`;
        })
        .style('cursor', 'pointer')
        .on('click', function(event, d) {
            event.stopPropagation();
            handleNodeClick(event, d);
        });
    
    // Add rectangles with dynamic width
    nodeEnter.append('rect')
        .attr('width', d => Math.max(180, d.data.name.length * 8))
        .attr('height', 45)
        .attr('x', d => -Math.max(90, d.data.name.length * 4))
        .attr('y', -22.5)
        .attr('rx', 5)
        .style('fill', d => getNodeColor(d.data.type))
        .style('stroke', d => getNodeBorderColor(d.data.type))
        .style('stroke-width', 2);
    
    // Add main text with smart truncation
    const mainText = nodeEnter.append('text')
        .attr('dy', '-6')
        .attr('text-anchor', 'middle')
        .style('font-size', '12px')
        .style('font-weight', 'bold')
        .style('pointer-events', 'none')
        .text(d => {
            const maxLength = Math.max(20, Math.floor((Math.max(180, d.data.name.length * 8) - 20) / 7));
            return d.data.name.length > maxLength ? 
                d.data.name.substring(0, maxLength - 3) + '...' : 
                d.data.name;
        });
    
    // Add tooltip for truncated text
    mainText.append('title')
        .text(d => d.data.name);
    
    // Add details text
    nodeEnter.append('text')
        .attr('dy', '12')
        .attr('text-anchor', 'middle')
        .style('font-size', '10px')
        .style('fill', '#666')
        .style('pointer-events', 'none')
        .text(d => d.data.details || '');
    
    // Transition nodes to their new position
    const nodeUpdate = nodeEnter.merge(node);
    
    // Ensure all nodes have click handlers
    nodeUpdate.style('cursor', 'pointer')
        .on('click', function(event, d) {
            event.stopPropagation();
            handleNodeClick(event, d);
        });
    
    nodeUpdate.transition()
        .duration(500)
        .attr('transform', d => `translate(${d.x},${d.y})`);
    
    // Remove exiting nodes
    const nodeExit = node.exit().transition()
        .duration(500)
        .attr('transform', d => {
            // Animate to parent's position, not root
            if (d.parent) {
                return `translate(${d.parent.x},${d.parent.y})`;
            }
            return `translate(${root.x},${root.y})`;
        })
        .remove();
    
    // Update links
    const link = g.selectAll('.link')
        .data(links, d => d.data.id);
    
    const linkEnter = link.enter().insert('path', 'g')
        .attr('class', 'link')
        .style('fill', 'none')
        .style('stroke', '#666')
        .style('stroke-width', 2)
        .attr('d', d => {
            // Start from parent's position
            const parentPos = d.parent ? {x: d.parent.x0 || d.parent.x, y: d.parent.y0 || d.parent.y} : {x: root.x0, y: root.y0};
            return diagonal(parentPos, parentPos);
        });
    
    const linkUpdate = linkEnter.merge(link);
    
    linkUpdate.transition()
        .duration(500)
        .attr('d', d => diagonal(d, d.parent));
    
    // Remove exiting links
    link.exit().transition()
        .duration(500)
        .attr('d', d => {
            // Animate to parent's position
            const parentPos = d.parent ? {x: d.parent.x, y: d.parent.y} : {x: root.x, y: root.y};
            return diagonal(parentPos, parentPos);
        })
        .remove();
    
    // Store old positions for smooth transitions
    nodes.forEach(d => {
        d.x0 = d.x;
        d.y0 = d.y;
    });
}

function diagonal(s, d) {
    return `M ${s.x} ${s.y}
            C ${s.x} ${(s.y + d.y) / 2},
              ${d.x} ${(s.y + d.y) / 2},
              ${d.x} ${d.y}`;
}

function restoreExpandedState(node) {
    if (expandedNodes.has(node.data.id)) {
        // Keep children visible
        if (node._children) {
            node.children = node._children;
            node._children = null;
        }
    } else {
        // Hide children
        if (node.children) {
            node._children = node.children;
            node.children = null;
        }
    }
    
    // Recursively restore state for all children
    if (node.children) {
        node.children.forEach(child => restoreExpandedState(child));
    }
    if (node._children) {
        node._children.forEach(child => restoreExpandedState(child));
    }
}

function toggleNode(d) {
    if (d.children) {
        // Collapse
        expandedNodes.delete(d.data.id);
        d._children = d.children;
        d.children = null;
    } else if (d._children) {
        // Expand from collapsed state
        expandedNodes.add(d.data.id);
        d.children = d._children;
        d._children = null;
    }
    updateTree();
}

function handleNodeClick(event, d) {
    console.log('Node clicked:', d.data);
    
    // Prevent concurrent loading
    if (isLoading) {
        console.log('Already loading, ignoring click');
        return;
    }
    
    if (d.data.type === 'dataset') {
        if (d.children || d._children) {
            // Already loaded - just toggle D3 tree and update info panel
            toggleNode(d);
            showNodeInfoFromData(d.data);
        } else {
            // Load new data for both D3 tree and info panel
            expandedNodes.add(d.data.id);
            expandDataset(d);
        }
    } else if (d.data.type === 'column') {
        if (d.children || d._children) {
            // Already loaded - just toggle D3 tree and update info panel
            toggleNode(d);
            showNodeInfoFromData(d.data);
        } else {
            // Load new data for both D3 tree and info panel
            expandedNodes.add(d.data.id);
            expandColumn(d);
        }
    } else {
        // For root, cell, or other node types, just update info panel
        selectNode(d.data);
    }
}

function expandDataset(datasetNode) {
    console.log('Expanding dataset:', datasetNode.data);
    
    // Set loading state
    isLoading = true;
    
    // Create unique target for this request
    const targetId = `htmx-target-${datasetNode.data.id}`;
    const existingTarget = document.getElementById(targetId);
    if (existingTarget) {
        existingTarget.remove();
    }
    
    const tempTarget = document.createElement('div');
    tempTarget.id = targetId;
    tempTarget.style.display = 'none';
    document.body.appendChild(tempTarget);
    
    htmx.ajax('GET', `/metadata/htmx/dataset/${datasetNode.data.datasetId}/columns/`, {
        target: `#${targetId}`,
        swap: 'innerHTML'
    }).then(function() {
        console.log('HTMX response received for dataset');
        parseColumnsFromTarget(datasetNode, targetId);
        // Clean up
        tempTarget.remove();
        isLoading = false;
    }).catch(function(error) {
        console.error('HTMX request failed:', error);
        tempTarget.remove();
        isLoading = false;
    });
}

function parseColumnsFromTarget(datasetNode, targetId) {
    console.log('parseColumnsFromTarget called with:', datasetNode, targetId);
    const container = document.getElementById(targetId);
    if (!container) {
        console.error('Target container not found:', targetId);
        return;
    }
    
    const columnDivs = container.querySelectorAll('[hx-get*="column"][hx-get*="cells"]');
    console.log('Found column divs:', columnDivs.length);
    
    const columns = [];
    columnDivs.forEach(div => {
        const url = div.getAttribute('hx-get');
        const columnId = url.match(/column\/([^/]+)\/cells/)[1];
        const name = div.querySelector('.font-medium').textContent;
        const cellCount = div.querySelector('.text-gray-500').textContent;
        
        columns.push({
            id: `column-${columnId}`,
            name: name,
            details: cellCount,
            type: 'column',
            columnId: columnId,
            children: []
        });
    });
    
    // Update D3.js tree structure
    datasetNode.data.children = columns;
    datasetNode.children = columns.map(child => {
        const childNode = d3.hierarchy(child);
        childNode.parent = datasetNode;
        childNode.depth = datasetNode.depth + 1;
        return childNode;
    });
    
    // Update both D3.js tree and info panel
    console.log('About to update tree with columns:', columns);
    updateTree();
    showNodeInfoFromData(datasetNode.data);
}

function expandColumn(columnNode) {
    console.log('Expanding column:', columnNode.data);
    
    // Set loading state
    isLoading = true;
    
    // Create unique target for this request
    const targetId = `htmx-target-${columnNode.data.id}`;
    const existingTarget = document.getElementById(targetId);
    if (existingTarget) {
        existingTarget.remove();
    }
    
    const tempTarget = document.createElement('div');
    tempTarget.id = targetId;
    tempTarget.style.display = 'none';
    document.body.appendChild(tempTarget);
    
    htmx.ajax('GET', `/metadata/htmx/column/${columnNode.data.columnId}/cells/`, {
        target: `#${targetId}`,
        swap: 'innerHTML'
    }).then(function() {
        console.log('HTMX response received for column');
        parseCellsFromTarget(columnNode, targetId);
        // Clean up
        tempTarget.remove();
        isLoading = false;
    }).catch(function(error) {
        console.error('HTMX request failed:', error);
        tempTarget.remove();
        isLoading = false;
    });
}

function parseCellsFromTarget(columnNode, targetId) {
    console.log('parseCellsFromTarget called with:', columnNode, targetId);
    const container = document.getElementById(targetId);
    if (!container) {
        console.error('Target container not found:', targetId);
        return;
    }
    
    const cellDivs = container.querySelectorAll('[hx-get*="cell"][hx-get*="connections"]');
    console.log('Found cell divs:', cellDivs.length);
    
    const cells = [];
    const maxCells = 10;
    
    for (let i = 0; i < Math.min(cellDivs.length, maxCells); i++) {
        const div = cellDivs[i];
        const url = div.getAttribute('hx-get');
        const cellId = url.match(/cell\/([^/]+)\/connections/)[1];
        const rowId = div.querySelector('.font-medium').textContent;
        const valueElement = div.querySelector('.text-gray-600');
        const value = valueElement ? valueElement.textContent.replace(/"/g, '').trim() : '';
        
        cells.push({
            id: `cell-${cellId}`,
            name: value.substring(0, 20) + (value.length > 20 ? '...' : ''),
            details: rowId.replace('Cell ', ''),
            type: 'cell',
            cellId: cellId,
            value: value
        });
    }
    
    // Update D3.js tree structure
    columnNode.data.children = cells;
    columnNode.children = cells.map(child => {
        const childNode = d3.hierarchy(child);
        childNode.parent = columnNode;
        childNode.depth = columnNode.depth + 1;
        return childNode;
    });
    
    // Update both D3.js tree and info panel
    updateTree();
    showNodeInfoFromData(columnNode.data);
}

function getNodeColor(type) {
    switch(type) {
        case 'root': return '#f0f0f0';
        case 'dataset': return '#e3f2fd';
        case 'column': return '#e8f5e8';
        case 'cell': return '#fff3e0';
        default: return '#ffffff';
    }
}

function getNodeBorderColor(type) {
    switch(type) {
        case 'root': return '#999';
        case 'dataset': return '#1976d2';
        case 'column': return '#388e3c';
        case 'cell': return '#f57c00';
        default: return '#333';
    }
}

function selectNode(nodeData) {
    if (nodeData.type === 'root') {
        // Show basic info for root
        document.getElementById('node-info').innerHTML = `
            <div class="space-y-3">
                <div class="font-semibold text-lg">${nodeData.name}</div>
                <div class="text-xs text-gray-500 uppercase tracking-wide">Type: ${nodeData.type}</div>
                <div class="text-xs text-gray-400 italic">Expand datasets to explore data</div>
            </div>
        `;
    } else if (nodeData.type === 'cell') {
        // Show cell info
        document.getElementById('node-info').innerHTML = `
            <div class="space-y-3">
                <div class="font-semibold text-lg">${nodeData.name}</div>
                <div class="text-xs text-gray-500 uppercase tracking-wide">Type: ${nodeData.type}</div>
                <div class="text-xs text-gray-500">${nodeData.details}</div>
                <div class="mt-2">
                    <div class="text-sm font-medium text-gray-700">Value:</div>
                    <div class="text-xs bg-blue-50 px-2 py-1 rounded border-l-2 border-blue-400 mt-1">
                        <div class="font-mono text-blue-600">"${nodeData.value || nodeData.name}"</div>
                    </div>
                </div>
            </div>
        `;
    } else {
        // Default simple info for other node types
        document.getElementById('node-info').innerHTML = `
            <div class="space-y-3">
                <div class="font-semibold text-lg">${nodeData.name}</div>
                <div class="text-xs text-gray-500 uppercase tracking-wide">Type: ${nodeData.type}</div>
                <div class="text-xs text-gray-500">${nodeData.details || ''}</div>
            </div>
        `;
    }
}

function showNodeInfoFromData(nodeData) {
    // Show node info using already loaded D3.js data
    const infoDiv = document.getElementById('node-info');
    
    let content = `
        <div class="space-y-3">
            <div class="font-semibold text-lg">${nodeData.name}</div>
            <div class="text-xs text-gray-500 uppercase tracking-wide">Type: ${nodeData.type}</div>
            <div class="text-xs text-gray-500">${nodeData.details}</div>
    `;
    
    if (nodeData.type === 'dataset' && nodeData.children) {
        content += `
            <div class="mt-3">
                <div class="text-sm font-medium text-gray-700 mb-2">Columns (${nodeData.children.length}):</div>
                <div class="space-y-1 max-h-[calc(100vh-300px)] overflow-y-auto">
        `;
        
        // Show ALL columns, not limited
        nodeData.children.forEach(column => {
            content += `
                <div class="text-xs bg-gray-50 px-2 py-1 rounded border-l-2 border-green-400 hover:bg-gray-100 transition-colors">
                    <div class="font-medium text-gray-800">${column.name}</div>
                    <div class="text-gray-500">${column.details}</div>
                </div>
            `;
        });
        
        content += `
                </div>
            </div>
        `;
    } else if (nodeData.type === 'column' && nodeData.children) {
        content += `
                            <div class="mt-3">
                <div class="text-sm font-medium text-gray-700 mb-2">Sample Values (${Math.min(nodeData.children.length, 10)}):</div>
                <div class="space-y-1 max-h-[calc(100vh-300px)] overflow-y-auto">
        `;
        
        for (let i = 0; i < Math.min(nodeData.children.length, 10); i++) {
            const cell = nodeData.children[i];
            content += `
                <div class="text-xs bg-orange-50 px-2 py-1 rounded border-l-2 border-orange-400">
                    <div class="font-mono text-blue-600">"${cell.value || cell.name}"</div>
                </div>
            `;
        }
        
        content += `
                </div>
            </div>
        `;
    }
    
    content += `</div>`;
    infoDiv.innerHTML = content;
}

function parseNodeInfoFromResponse(nodeData) {
    const container = document.getElementById('htmx-target');
    const infoDiv = document.getElementById('node-info');
    
    let content = `
        <div class="space-y-3">
            <div class="font-semibold text-lg">${nodeData.name}</div>
            <div class="text-xs text-gray-500 uppercase tracking-wide">Type: ${nodeData.type}</div>
    `;
    
    if (nodeData.type === 'dataset') {
        content += `<div class="text-xs text-gray-500">${nodeData.details}</div>`;
        
        // Parse columns from HTMX response
        const columnDivs = container.querySelectorAll('[hx-get*="column"][hx-get*="cells"]');
        if (columnDivs.length > 0) {
            content += `
                <div class="mt-3">
                    <div class="text-sm font-medium text-gray-700 mb-2">All Columns (${columnDivs.length}):</div>
                    <div class="space-y-1 max-h-[calc(100vh-300px)] overflow-y-auto border rounded p-2 bg-gray-50">
            `;
            
            // Show ALL columns from HTMX response
            columnDivs.forEach(div => {
                const name = div.querySelector('.font-medium')?.textContent || 'Unknown';
                const details = div.querySelector('.text-gray-500')?.textContent || '';
                content += `
                    <div class="text-xs bg-white px-2 py-1 rounded border-l-2 border-green-400 hover:bg-green-50 transition-colors shadow-sm">
                        <div class="font-medium text-gray-800">${name}</div>
                        <div class="text-gray-500">${details}</div>
                    </div>
                `;
            });
            
            content += `
                    </div>
                </div>
            `;
        }
    } else if (nodeData.type === 'column') {
        content += `<div class="text-xs text-gray-500">${nodeData.details}</div>`;
        
        // Parse cells from HTMX response
        const cellDivs = container.querySelectorAll('[hx-get*="cell"][hx-get*="connections"]');
        if (cellDivs.length > 0) {
            content += `
                <div class="mt-3">
                    <div class="text-sm font-medium text-gray-700 mb-2">Sample Values (${Math.min(cellDivs.length, 10)}):</div>
                    <div class="space-y-1 max-h-[calc(100vh-300px)] overflow-y-auto">
            `;
            
            for (let i = 0; i < Math.min(cellDivs.length, 10); i++) {
                const div = cellDivs[i];
                const valueElement = div.querySelector('.text-gray-600');
                const value = valueElement ? valueElement.textContent.replace(/"/g, '').trim() : 'No value';
                content += `
                    <div class="text-xs bg-orange-50 px-2 py-1 rounded border-l-2 border-orange-400">
                        <div class="font-mono text-blue-600">"${value}"</div>
                    </div>
                `;
            }
            
            content += `
                    </div>
                </div>
            `;
        }
    } else if (nodeData.type === 'cell') {
        content += `
            <div class="text-xs text-gray-500">${nodeData.details}</div>
            <div class="mt-2">
                <div class="text-sm font-medium text-gray-700">Value:</div>
                <div class="text-xs bg-blue-50 px-2 py-1 rounded border-l-2 border-blue-400 mt-1">
                    <div class="font-mono text-blue-600">"${nodeData.value || nodeData.name}"</div>
                </div>
            </div>
        `;
        
        // Parse connections from HTMX response if available
        const connectionDivs = container.querySelectorAll('[data-connection]');
        if (connectionDivs.length > 0) {
            content += `
                <div class="mt-3">
                    <div class="text-sm font-medium text-gray-700 mb-2">Connections (${connectionDivs.length}):</div>
                    <div class="space-y-1 max-h-[calc(100vh-300px)] overflow-y-auto">
                        <div class="text-xs text-gray-400 italic">Connected to other cells</div>
                    </div>
                </div>
            `;
        }
    }
    
    content += `</div>`;
    infoDiv.innerHTML = content;
}

function fitTree() {
    const bbox = g.node().getBBox();
    const fullWidth = width + margin.left + margin.right;
    const fullHeight = height + margin.top + margin.bottom;
    const scale = Math.min(fullWidth / bbox.width, fullHeight / bbox.height) * 0.8;
    const translateX = (fullWidth - bbox.width * scale) / 2 - bbox.x * scale + margin.left;
    const translateY = (fullHeight - bbox.height * scale) / 2 - bbox.y * scale + margin.top;
    
    svg.transition()
        .duration(750)
        .call(zoom.transform, d3.zoomIdentity.translate(translateX, translateY).scale(scale));
}

function resetTree() {
    expandedNodes.clear();
    
    // Reset zoom to initial position
    svg.transition()
        .duration(500)
        .call(zoom.transform, d3.zoomIdentity.translate(margin.left, margin.top));
    
    loadInitialDatasets();
}

function zoomIn() {
    svg.transition()
        .duration(300)
        .call(zoom.scaleBy, 1.5);
}

function zoomOut() {
    svg.transition()
        .duration(300)
        .call(zoom.scaleBy, 1 / 1.5);
}
</script>
