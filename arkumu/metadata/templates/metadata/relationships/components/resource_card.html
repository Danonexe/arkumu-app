<!-- Resource Card Component -->
<div class="card bg-base-100 shadow-sm border border-base-300 hover:shadow-md transition-shadow">
    <div class="card-body p-4">
        <!-- Header with resource name and type -->
        <div class="flex items-start justify-between mb-3">
            <div class="flex-1 min-w-0">
                <h3 class="font-semibold text-base-content truncate" title="{{ resource.name }}">
                    {{ resource.name|default:"Unnamed Resource" }}
                </h3>
                <p class="text-xs text-base-content/70 font-mono truncate mt-1" title="{{ resource.uri }}">
                    {{ resource.uri }}
                </p>
            </div>
            <div class="flex flex-col items-end gap-1 ml-2">
                <span class="badge badge-outline badge-sm">{{ resource.resource_type }}</span>
                <span class="badge badge-primary badge-sm">{{ resource.source }}</span>
            </div>
        </div>

        <!-- Resource value preview -->
        {% if resource.value %}
            <div class="bg-base-200 rounded p-2 mb-3">
                <p class="text-xs text-base-content/80 line-clamp-2">
                    {{ resource.value|truncatechars:100 }}
                </p>
            </div>
        {% endif %}

        <!-- Actions -->
        <div class="flex items-center justify-between mt-auto">
            <div class="flex gap-2">
                <button class="btn btn-xs btn-outline"
                        hx-get="{% url 'metadata:resource_relationships' resource.id %}"
                        hx-target="#relationship-content"
                        hx-indicator="#loading-indicator"
                        hx-push-url="true">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                    </svg>
                    Explore
                </button>
                <button class="btn btn-xs btn-ghost"
                        onclick="navigator.clipboard.writeText('{{ resource.uri }}')">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    Copy URI
                </button>
            </div>
            
            <!-- Relationship indicators -->
            <div class="flex items-center gap-1">
                {% if resource.id != main_resource.id %}
                    <div class="tooltip tooltip-left" data-tip="Connected to current resource">
                        <div class="w-2 h-2 bg-success rounded-full"></div>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>

<!-- Custom styles for line clamping -->
<style>
    .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
</style>
