{% load metadata_tags %}

{% for row in data %}
<tr class="hover:bg-base-200/50 transition-colors">
    {% for cell in row %}
    <td class="p-2 border border-base-300 text-xs min-w-[120px] whitespace-nowrap overflow-hidden text-ellipsis cursor-pointer hover:bg-primary-50"
        data-column-index="{{ forloop.counter0 }}"
        {% if source and dataset %}
        data-dataset-name="{{ dataset }}"
        data-source-name="{{ source }}"
        _="on click 
            log 'Cell clicked in column index:', '{{ forloop.counter0 }}'
            log 'Dataset:', @data-dataset-name
            log 'Source:', @data-source-name
            
            -- Get the column header from the table header
            set datasetName to @data-dataset-name
            set columnHeaderId to 'column-{{ forloop.counter0 }}-' + datasetName
            set columnHeader to the innerText of #{columnHeaderId}
            log 'Column name:', columnHeader
            
            -- Focus the column this cell belongs to using the existing highlighting system
            if columnHeader then
                trigger highlightColumn(columnName: columnHeader) on body
            end"
        {% endif %}
        title="{{ cell|escape }}">
        {% if cell %}
            <span class="font-mono">{{ cell }}</span>
        {% else %}
            <span class="text-base-content/40 italic">empty</span>
        {% endif %}
    </td>
    {% endfor %}
</tr>
{% endfor %}
