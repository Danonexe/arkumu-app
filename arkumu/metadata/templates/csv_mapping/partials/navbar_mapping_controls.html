<!-- Responsive Mapping Controls Container -->
<div class="flex flex-col lg:flex-row lg:items-center gap-2 lg:gap-4 min-w-0">
    
    {% if current_mapping_id %}
        <!-- Current Mapping Save Section - Enhanced Grid -->
        <div class="grid grid-cols-3 gap-2 items-center flex-shrink-0">
            <!-- Row 1, Col 1: Current mapping name -->
            <div class="flex items-center gap-2 col-span-2">
                <span class="text-sm font-medium truncate">{{ current_mapping_name }}</span>
                {% if current_mapping_updated %}
                    <span class="text-xs opacity-60 hidden sm:inline">• {{ current_mapping_updated }}</span>
                {% endif %}
            </div>
            
            <!-- Row 1, Col 3: View Graph and Overview buttons -->
            <div class="flex gap-1">
                <button class="btn btn-primary btn-xs text-white"
                        hx-get="{% url 'metadata:mapping_graph_data' %}"
                        hx-vals='{"organization": "{{ organization_id }}", "mapping_id": "{{ current_mapping_id }}"}'
                        hx-target="#mapping-graph-modal"
                        hx-swap="outerHTML"
                        title="View relationship graph">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
                    </svg>
                    Graph
                </button>
                <button class="btn btn-primary btn-xs text-white"
                        hx-get="{% url 'metadata:mapping_overview_data' %}"
                        hx-vals='{"organization": "{{ organization_id }}", "mapping_id": "{{ current_mapping_id }}"}'
                        hx-target="#mapping-overview-modal"
                        hx-swap="outerHTML"
                        title="View mapping overview">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Overview
                </button>
            </div>
            
            <!-- Row 2, Col 1: Save button -->
            <button class="btn btn-neutral btn-xs"
                    hx-post="{% url 'metadata:csv_save_mapping_htmx' %}"
                    hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "action": "update", "mapping_name": "{{ current_mapping_name }}"}'
                    hx-include="#current-mapping-id"
                    hx-target="#save-feedback"
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.xhr.status === 200) { showMappingGraphModal('{{ current_mapping_id }}', '{{ current_mapping_name }}', '{{ current_mapping_description|default:'' }}'); }">
                Save
            </button>
            
            <!-- Row 2, Col 2: Save as input -->
            <input type="text" 
                   id="save-as-name"
                   name="mapping_name"
                   placeholder="Save as new name..."
                   class="input input-bordered input-sm">
            
            <!-- Row 2, Col 3: Save As button -->
            <button class="btn btn-outline btn-xs"
                    hx-post="{% url 'metadata:csv_save_mapping_htmx' %}"
                    hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "action": "create"}'
                    hx-include="#save-as-name"
                    hx-target="#save-feedback"
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.xhr.status === 200) { htmx.trigger('#load-mapping-select', 'load'); document.getElementById('save-as-name').value = ''; const newMappingName = document.getElementById('save-as-name').getAttribute('data-last-saved') || 'New Mapping'; showMappingGraphModal(event.detail.xhr.getResponseHeader('X-Mapping-ID') || '{{ current_mapping_id }}', newMappingName); }">
                Save As
            </button>
        </div>
        
        <input type="hidden" id="current-mapping-id" name="current_mapping_id" value="{{ current_mapping_id }}">
    {% else %}
        <!-- Save New Row -->
        <div class="flex items-center gap-2">
            <input type="text" 
                   id="new-mapping-name"
                   name="mapping_name"
                   placeholder="New mapping name"
                   class="input input-bordered input-sm w-36 min-w-0">
            <button class="btn btn-neutral btn-xs flex-shrink-0"
                    hx-post="{% url 'metadata:csv_save_mapping_htmx' %}"
                    hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "action": "create"}'
                    hx-include="#new-mapping-name"
                    hx-target="#save-feedback"
                    hx-swap="innerHTML">
                Save New
            </button>
        </div>
    {% endif %}

    <!-- Divider (hidden on mobile) -->
    <div class="divider divider-horizontal mx-1 hidden lg:flex"></div>

    <!-- Load Mapping Row -->
    <div class="flex items-center gap-2">
        <select id="load-mapping-select" 
                name="mapping_id"
                class="select select-bordered select-sm w-36 min-w-0"
                hx-get="{% url 'metadata:csv_list_mappings' %}"
                hx-vals='{"organization": "{{ organization_id }}"}'
                hx-trigger="load"
                hx-target="this"
                hx-swap="innerHTML">
            <option value="">Select</option>
        </select>
        <button class="btn btn-warning btn-sm flex-shrink-0" 
                hx-post="{% url 'metadata:csv_load_mapping_htmx' %}"
                hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                hx-include="#load-mapping-select"
                hx-target="#mapping-status"
                hx-swap="innerHTML"
                hx-confirm="Replace current work?">
            Load
        </button>
    </div>
</div>
