{% load i18n %}

<!-- External Ontology Configuration Form -->
<div id="external-ontology-form-{{ column.id|slugify }}" class="mt-4 p-4 bg-base-200 rounded-lg border border-base-300">
    <div class="flex items-center justify-between mb-4">
        <h4 class="text-lg font-semibold flex items-center gap-2">
            <span class="text-2xl">🌐</span>
            {% trans "External Ontology Configuration" %}
        </h4>
        <button type="button" 
                class="btn btn-ghost btn-sm"
                hx-get="{% url 'metadata:csv_hide_external_ontology_form' %}?column_id={{ column.id }}"
                hx-target="#external-ontology-form-{{ column.id|slugify }}"
                hx-swap="outerHTML">
            ✕
        </button>
    </div>
    
    <form hx-post="{% url 'metadata:csv_save_external_ontology' %}"
          hx-target="#column-{{ column.id|slugify }}"
          hx-swap="outerHTML"
          hx-trigger="submit"
          class="space-y-4">
        
        <!-- Hidden field for column ID -->
        <input type="hidden" name="column_id" value="{{ column.id }}">
        <input type="hidden" name="organization" value="{{ organization_id }}">
        {% csrf_token %}
        
        <!-- Column Information -->
        <div class="bg-base-100 p-3 rounded border">
            <h5 class="font-medium text-sm mb-1">{% trans "Column Information" %}</h5>
            <p class="text-sm text-base-content/70">
                <strong>{% trans "Dataset" %}:</strong> {{ column.dataset }}<br>
                <strong>{% trans "Column" %}:</strong> {{ column.name }}
            </p>
        </div>
        
        <!-- Ontology Type Selection -->
        <div class="form-control">
            <label class="label">
                <span class="label-text font-medium">{% trans "Ontology Type" %} <span class="text-error">*</span></span>
            </label>
            <select name="ontology_type" 
                    id="ontology-type-{{ column.id|slugify }}"
                    class="select select-bordered w-full"
                    required
                    onchange="updateOntologyPreset(this.value, '{{ column.id|slugify }}')">
                <option value="">{% trans "Select ontology type..." %}</option>
                {% for key, preset in ontology_presets.items %}
                    <option value="{{ key }}" 
                            {% if ontology_type == key %}selected{% endif %}
                            data-template="{{ preset.uri_template }}"
                            data-pattern="{{ preset.identifier_pattern }}"
                            data-example="{{ preset.example }}"
                            data-description="{{ preset.description }}">
                        {{ preset.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <!-- URI Template -->
        <div class="form-control">
            <label class="label">
                <span class="label-text font-medium">{% trans "URI Template" %}</span>
            </label>
            <input type="text" 
                   name="uri_template" 
                   id="uri-template-{{ column.id|slugify }}"
                   class="input input-bordered w-full font-mono text-sm" 
                   placeholder="https://example.org/{identifier}"
                   value="{{ uri_template }}">
        </div>
        
        <!-- Action Buttons -->
        <div class="flex justify-between items-center pt-4 border-t">
            <button type="button" 
                    class="btn btn-ghost btn-sm"
                    hx-get="{% url 'metadata:csv_hide_external_ontology_form' %}?column_id={{ column.id }}"
                    hx-target="#external-ontology-form-{{ column.id|slugify }}"
                    hx-swap="outerHTML">
                {% trans "Cancel" %}
            </button>
            
            <button type="submit" class="btn btn-primary btn-sm">
                {% trans "Save Configuration" %}
            </button>
        </div>
    </form>
</div>

<script>
function updateOntologyPreset(ontologyType, columnId) {
    const selectElement = document.getElementById(`ontology-type-${columnId}`);
    const selectedOption = selectElement.options[selectElement.selectedIndex];
    const templateField = document.getElementById(`uri-template-${columnId}`);
    
    if (ontologyType && selectedOption) {
        const template = selectedOption.dataset.template;
        templateField.value = template;
        
        if (ontologyType === 'custom' || ontologyType === 'cidoc_crm' || ontologyType === 'arkumu') {
            templateField.removeAttribute('readonly');
            if (ontologyType === 'custom') {
                templateField.focus();
            }
        } else {
            templateField.setAttribute('readonly', true);
        }
    } else {
        templateField.value = '';
        templateField.removeAttribute('readonly');
    }
}

// Initialize the form when loaded
document.addEventListener('DOMContentLoaded', function() {
    const columnId = '{{ column.id|slugify }}';
    const currentType = '{{ ontology_type }}';
    if (currentType) {
        updateOntologyPreset(currentType, columnId);
    }
});
</script>
