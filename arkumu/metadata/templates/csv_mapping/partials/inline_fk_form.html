<!-- Inline FK Configuration Form -->
<div id="fk-form-{{ column.id|slugify }}" class="ml-6 mt-2 p-3 border border-base-300 rounded-lg bg-base-50">
    <form hx-post="{% url 'metadata:csv_save_inline_fk_config' %}"
          hx-target="#column-{{ column.id|slugify }}"
          hx-swap="outerHTML">
        {% csrf_token %}
        <input type="hidden" name="column_id" value="{{ column.id }}">
        <input type="hidden" name="organization" value="{{ organization_id }}">
        
        <div class="space-y-3">
            <div class="text-sm font-medium text-base-content">🔗 Link {{ column.name }} to:</div>
            
            <!-- Hidden input for direction (always outbound) -->
            <input type="hidden" name="fk_direction" value="outbound">
            
            <!-- Hidden form for target column update data -->
            <form id="target-column-data-form-{{ column.id|slugify }}" style="display: none;">
                <input type="hidden" name="column_id" value="{{ column.id }}">
                <input type="hidden" name="organization" value="{{ organization_id }}">
                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            </form>
            
            <!-- Target Dataset Selection -->
            <div class="form-control">
                <label class="label label-text text-xs">📊 Dataset:</label>
                <select name="target_dataset" class="select select-xs select-bordered" 
                        hx-post="{% url 'metadata:csv_update_fk_target_columns' %}"
                        hx-include="#target-column-data-form-{{ column.id|slugify }}, [name='target_dataset']"
                        hx-target="#target-column-select-{{ column.id|slugify }}"
                        hx-swap="innerHTML"
                        hx-trigger="change">
                    <option value="">Choose dataset...</option>
                    {% for dataset in datasets %}
                        {% if dataset.name != column.dataset %}
                        <option value="{{ dataset.name }}" {% if dataset.name == target_dataset %}selected{% endif %}>
                            {{ dataset.name }}
                        </option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
            
            <!-- Target Column Selection -->
            <div class="form-control">
                <label class="label label-text text-xs">🎯 Column:</label>
                <select name="target_column" id="target-column-select-{{ column.id|slugify }}" class="select select-xs select-bordered">
                    <option value="">Choose column...</option>
                    {% if target_dataset %}
                        {% for dataset in datasets %}
                            {% if dataset.name == target_dataset %}
                                {% for column_name in dataset.preview.colHeaders %}
                                <option value="{{ column_name }}" {% if column_name == target_column %}selected{% endif %}>
                                    {{ column_name }}
                                </option>
                                {% endfor %}
                            {% endif %}
                        {% endfor %}
                    {% endif %}
                </select>
            </div>
            
            <!-- Action Buttons -->
            <div class="flex gap-2 justify-end">
                <button type="button" class="btn btn-xs btn-ghost" 
                        hx-get="{% url 'metadata:csv_hide_fk_form' %}?column_id={{ column.id|urlencode }}"
                        hx-target="#fk-form-{{ column.id|slugify }}"
                        hx-swap="outerHTML">
                    Cancel
                </button>
                {% if column.is_fk %}
                <button type="button" class="btn btn-xs btn-error btn-outline" 
                        hx-post="{% url 'metadata:remove_fk_config' %}"
                        hx-vals='{"column_id": "{{ column.id }}", "organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                        hx-target="#selected-columns-workspace"
                        hx-swap="innerHTML">
                    Remove
                </button>
                {% endif %}
                <button type="submit" class="btn btn-xs btn-secondary">Link</button>
            </div>
        </div>
    </form>
</div>
