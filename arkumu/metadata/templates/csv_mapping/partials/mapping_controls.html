{% load i18n %}

<!-- Enhanced Collapsible Mapping Controls Card -->
<div class="card bg-gradient-to-br from-base-100 to-base-200 shadow-lg border border-base-300 mb-6">
    <div class="collapse collapse-arrow">
        <input type="checkbox" id="mapping-controls-toggle" class="collapse-checkbox" />
        <div class="collapse-title p-4 min-h-0">
            <!-- Header -->
            <div class="flex items-center gap-3">
                <div class="avatar placeholder">
                    <div class="bg-primary text-primary-content rounded-full w-8 h-8">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                    </div>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-semibold text-base-content">{% trans "Mapping Management" %}</h3>
                    <p class="text-sm text-base-content/70">{% trans "Save, load, and manage your CSV mapping configurations" %}</p>
                </div>
            </div>
        </div>
        
        <div class="collapse-content px-4 pb-4">
            <!-- Quick Save Section -->
            <div class="bg-base-100 rounded-lg p-4 mb-4 border border-base-300">
                <div class="flex items-center gap-2 mb-3">
                    <div class="badge badge-success badge-sm">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                        {% trans "Quick Save" %}
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="form-control flex-1">
                        <input type="text" 
                               id="mapping-name-input"
                               name="mapping_name"
                               placeholder="{% trans 'Enter mapping name...' %}"
                               class="input input-bordered input-sm focus:input-primary"
                               {% if organization_id %}
                               hx-get="{% url 'metadata:csv_validate_mapping_name' %}"
                               hx-vals='{"organization": "{{ organization_id }}"}'
                               hx-trigger="keyup changed delay:300ms"
                               hx-target="#save-mapping-btn"
                               hx-swap="outerHTML"
                               {% else %}
                               disabled
                               {% endif %}>
                    </div>
                    <button class="btn btn-sm {% if not organization_id %}btn-disabled{% else %}btn-success{% endif %}" 
                            id="save-mapping-btn"
                            {% if organization_id %}
                            hx-post="{% url 'metadata:csv_save_mapping_htmx' %}"
                            hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                            hx-include="#mapping-name-input"
                            hx-target="#mapping-status"
                            hx-swap="innerHTML"
                            {% endif %}
                            disabled>
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        {% trans "Save" %}
                        <span class="loading loading-spinner loading-xs htmx-indicator ml-1"></span>
                    </button>
                </div>
            </div>
            
            <!-- Load/Manage Section -->
            <div class="bg-base-100 rounded-lg p-4 border border-base-300">
                <div class="flex items-center gap-2 mb-3">
                    <div class="badge badge-info badge-sm">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
                        </svg>
                        {% trans "Load & Manage" %}
                    </div>
                </div>
                
                <div class="space-y-3">
                    <!-- Mapping Selection -->
                    <div class="form-control">
                        <select id="mapping-select" 
                                name="mapping_id"
                                class="select select-bordered select-sm focus:select-primary w-full"
                                {% if organization_id %}
                                hx-get="{% url 'metadata:csv_list_mappings' %}"
                                hx-vals='{"organization": "{{ organization_id }}"}'
                                hx-trigger="load, refreshMappings from:body"
                                hx-target="this"
                                hx-swap="innerHTML"
                                hx-on:change="
                                    const mappingId = this.value;
                                    const organization = '{{ organization_id }}';
                                    
                                    // Update load button state
                                    htmx.ajax('GET', '{% url 'metadata:csv_update_button_state' %}', {
                                        values: {button: 'load', mapping_id: mappingId, organization: organization},
                                        target: '#load-mapping-btn',
                                        swap: 'outerHTML'
                                    });
                                    
                                    // Update delete button state  
                                    htmx.ajax('GET', '{% url 'metadata:csv_update_button_state' %}', {
                                        values: {button: 'delete', mapping_id: mappingId, organization: organization},
                                        target: '#delete-mapping-btn',
                                        swap: 'outerHTML'
                                    });
                                "
                                {% endif %}>
                            {% if organization_id %}
                            <option value="">{% trans "🔍 Select saved mapping..." %}</option>
                            {% else %}
                            <option value="">{% trans "⚠️ Select organization first..." %}</option>
                            {% endif %}
                        </select>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="flex gap-2">
                        <button class="btn btn-sm btn-info flex-1" 
                                id="load-mapping-btn"
                                {% if organization_id %}
                                hx-post="{% url 'metadata:csv_load_mapping_htmx' %}"
                                hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "button": "load"}'
                                hx-include="#mapping-select"
                                hx-target="#mapping-status"
                                hx-swap="innerHTML"
                                hx-confirm="{% trans 'Replace current mapping?' %}"
                                hx-trigger="click"
                                {% endif %}
                                disabled>
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
                            </svg>
                            {% trans "Load" %}
                            <span class="loading loading-spinner loading-xs htmx-indicator ml-1"></span>
                        </button>
                        
                        <button class="btn btn-sm btn-warning" 
                                id="delete-mapping-btn"
                                {% if organization_id %}
                                hx-post="{% url 'metadata:csv_delete_mapping_htmx' %}"
                                hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "button": "delete"}'
                                hx-include="#mapping-select"
                                hx-target="#mapping-status"
                                hx-swap="innerHTML"
                                hx-confirm="{% trans 'Delete permanently?' %}"
                                hx-trigger="click"
                                {% endif %}
                                disabled>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                            <span class="hidden sm:inline ml-1">{% trans "Delete" %}</span>
                            <span class="loading loading-spinner loading-xs htmx-indicator ml-1"></span>
                        </button>
                        
                        <div class="tooltip tooltip-top" data-tip="{% trans 'Refresh list' %}">
                            <button class="btn btn-sm btn-ghost btn-circle" 
                                    id="refresh-mappings-btn"
                                    onclick="htmx.trigger('body', 'refreshMappings')">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Status Messages -->
            <div id="mapping-status" class="hidden mt-4"
                 hx-on:htmx:afterSettle="setTimeout(() => { this.classList.add('hidden'); this.innerHTML = ''; }, 4000)"
                 hx-on:clearMappingInput="document.getElementById('mapping-name-input').value = ''"
                 hx-on:clearMappingSelection="document.getElementById('mapping-select').value = ''"
                 hx-on:refreshMappings="htmx.trigger('#mapping-select', 'load')">
                <!-- Success/error messages will appear here -->
            </div>
        </div>
    </div>
</div>
