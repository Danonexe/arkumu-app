<!-- Collapsible Mapping Controls -->
<div class="bg-base-100 border-b border-base-300">
    <!-- Collapsed State - Always Visible -->
    <div class="px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <!-- Current Mapping Info -->
            {% if current_mapping_id %}
                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium">Current:</span>
                    <span class="text-sm">{{ current_mapping_name }}</span>
                    <span class="text-xs opacity-60">• Last saved recently</span>
                </div>
                <!-- Quick Save Button -->
                <button class="btn btn-success btn-sm"
                        {% if organization_id %}
                        hx-post="{% url 'metadata:csv_save_mapping_htmx' %}"
                        hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "action": "update", "mapping_name": "{{ current_mapping_name }}"}'
                        hx-include="#current-mapping-id"
                        hx-target="#save-feedback"
                        hx-swap="innerHTML"
                        {% endif %}>
                    Save
                </button>
                <input type="hidden" id="current-mapping-id" name="current_mapping_id" value="{{ current_mapping_id }}">
            {% else %}
                <span class="text-sm opacity-60">No mapping loaded</span>
            {% endif %}
        </div>
        
        <!-- Toggle Button -->
        <button class="btn btn-ghost btn-sm" onclick="toggleMappingControls()">
            <span id="toggle-text">More options</span>
        </button>
    </div>
    
    <!-- Expanded State - Hidden by default -->
    <div id="expanded-controls" class="px-6 pb-4 border-t border-base-300" style="display: none;">
        <div class="flex items-center gap-4 flex-wrap">
            <!-- Save New -->
            {% if not current_mapping_id %}
                <input type="text" 
                       id="new-mapping-name"
                       name="mapping_name"
                       placeholder="New mapping name"
                       class="input input-bordered input-sm w-48"
                       {% if not organization_id %}disabled{% endif %}>
                <button class="btn btn-success btn-sm"
                        {% if organization_id %}
                        hx-post="{% url 'metadata:csv_save_mapping_htmx' %}"
                        hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "action": "create"}'
                        hx-include="#new-mapping-name"
                        hx-target="#save-feedback"
                        hx-swap="innerHTML"
                        {% endif %}>
                    Save New
                </button>
            {% endif %}
            
            <!-- Load Mapping -->
            <select id="load-mapping-select" 
                    name="mapping_id"
                    class="select select-bordered select-sm w-48"
                    {% if organization_id %}
                    hx-get="{% url 'metadata:csv_list_mappings' %}"
                    hx-vals='{"organization": "{{ organization_id }}"}'
                    hx-trigger="load"
                    hx-target="this"
                    hx-swap="innerHTML"
                    {% endif %}>
                {% if organization_id %}
                <option value="">Load mapping...</option>
                {% else %}
                <option value="">Select organization first...</option>
                {% endif %}
            </select>
            <button class="btn btn-info btn-sm" 
                    {% if organization_id %}
                    hx-post="{% url 'metadata:csv_load_mapping_htmx' %}"
                    hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                    hx-include="#load-mapping-select"
                    hx-target="#mapping-status"
                    hx-swap="innerHTML"
                    hx-confirm="Replace current work?"
                    {% endif %}>
                Load
            </button>
            
            <!-- Delete Mapping -->
            <select id="delete-mapping-select" 
                    name="mapping_id"
                    class="select select-bordered select-sm w-48"
                    {% if organization_id %}
                    hx-get="{% url 'metadata:csv_list_mappings' %}"
                    hx-vals='{"organization": "{{ organization_id }}"}'
                    hx-trigger="load"
                    hx-target="this"
                    hx-swap="innerHTML"
                    {% endif %}>
                {% if organization_id %}
                <option value="">Delete mapping...</option>
                {% else %}
                <option value="">Select organization first...</option>
                {% endif %}
            </select>
            <button class="btn btn-error btn-sm" 
                    {% if organization_id %}
                    hx-post="{% url 'metadata:csv_delete_mapping_htmx' %}"
                    hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                    hx-include="#delete-mapping-select"
                    hx-target="#mapping-status"
                    hx-swap="innerHTML"
                    hx-confirm="Permanently delete?"
                    {% endif %}>
                Delete
            </button>
        </div>
        
        <!-- Feedback Messages -->
        <div id="save-feedback" class="mt-2"></div>
        <div id="mapping-status" class="mt-2"></div>
    </div>
</div>

<script>
function toggleMappingControls() {
    const expanded = document.getElementById('expanded-controls');
    const toggleText = document.getElementById('toggle-text');
    
    if (expanded.style.display === 'none') {
        expanded.style.display = 'block';
        toggleText.textContent = 'Less options';
    } else {
        expanded.style.display = 'none';
        toggleText.textContent = 'More options';
    }
}
</script>
