{% load i18n %}

<!-- Collapsible Mapping Controls -->
<div class="collapse collapse-arrow bg-base-200 mb-3">
    <input type="checkbox" id="mapping-controls-toggle" class="collapse-checkbox" />
    <div class="collapse-title text-sm font-medium py-2 px-3 min-h-0">
        <div class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            {% trans "Save/Load Mappings" %}
        </div>
    </div>
    <div class="collapse-content px-3 pb-3">
        <!-- Quick Save Section -->
        <div class="mb-3">
            <div class="flex gap-2">
                <input type="text" 
                       id="mapping-name-input"
                       name="mapping_name"
                       placeholder="{% trans 'Mapping name...' %}"
                       class="input input-bordered input-xs flex-1"
                       {% if organization_id %}
                       hx-get="{% url 'metadata:csv_validate_mapping_name' %}"
                       hx-vals='{"organization": "{{ organization_id }}"}'
                       hx-trigger="keyup changed delay:300ms"
                       hx-target="#save-mapping-btn"
                       hx-swap="outerHTML"
                       {% else %}
                       disabled
                       {% endif %}>
                <button class="btn btn-xs btn-primary {% if not organization_id %}btn-disabled{% else %}btn-disabled{% endif %}" 
                        id="save-mapping-btn"
                        {% if organization_id %}
                        hx-post="{% url 'metadata:csv_save_mapping_htmx' %}"
                        hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                        hx-include="#mapping-name-input"
                        hx-target="#mapping-status"
                        hx-swap="innerHTML"
                        {% endif %}
                        disabled>
                    {% trans "Save" %}
                    <span class="loading loading-spinner loading-xs htmx-indicator"></span>
                </button>
            </div>
        </div>
        
        <!-- Load/Manage Section -->
        <div class="space-y-2">
            <select id="mapping-select" 
                    name="mapping_id"
                    class="select select-bordered select-xs w-full"
                    {% if organization_id %}
                    hx-get="{% url 'metadata:csv_list_mappings' %}"
                    hx-vals='{"organization": "{{ organization_id }}"}'
                    hx-trigger="load, refreshMappings from:body"
                    hx-target="this"
                    hx-swap="innerHTML"
                    hx-on:change="
                        const mappingId = this.value;
                        const organization = '{{ organization_id }}';
                        
                        // Update load button state
                        htmx.ajax('GET', '{% url 'metadata:csv_update_button_state' %}', {
                            values: {button: 'load', mapping_id: mappingId, organization: organization},
                            target: '#load-mapping-btn',
                            swap: 'outerHTML'
                        });
                        
                        // Update delete button state  
                        htmx.ajax('GET', '{% url 'metadata:csv_update_button_state' %}', {
                            values: {button: 'delete', mapping_id: mappingId, organization: organization},
                            target: '#delete-mapping-btn',
                            swap: 'outerHTML'
                        });
                    "
                    {% endif %}>
                {% if organization_id %}
                <option value="">{% trans "Select saved mapping..." %}</option>
                {% else %}
                <option value="">{% trans "Select organization first..." %}</option>
                {% endif %}
            </select>
            
            <div class="flex gap-1">
                <button class="btn btn-xs btn-secondary flex-1 btn-disabled" 
                        id="load-mapping-btn"
                        {% if organization_id %}
                        hx-post="{% url 'metadata:csv_load_mapping_htmx' %}"
                        hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "button": "load"}'
                        hx-include="#mapping-select"
                        hx-target="#mapping-status"
                        hx-swap="innerHTML"
                        hx-confirm="{% trans 'Replace current mapping?' %}"
                        hx-trigger="click"
                        {% endif %}
                        disabled>
                    {% trans "Load" %}
                    <span class="loading loading-spinner loading-xs htmx-indicator"></span>
                </button>
                
                <button class="btn btn-xs btn-error btn-outline btn-disabled" 
                        id="delete-mapping-btn"
                        {% if organization_id %}
                        hx-post="{% url 'metadata:csv_delete_mapping_htmx' %}"
                        hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "button": "delete"}'
                        hx-include="#mapping-select"
                        hx-target="#mapping-status"
                        hx-swap="innerHTML"
                        hx-confirm="{% trans 'Delete permanently?' %}"
                        hx-trigger="click"
                        {% endif %}
                        disabled>
                    {% trans "Delete" %}
                    <span class="loading loading-spinner loading-xs htmx-indicator"></span>
                </button>
                
                <button class="btn btn-xs btn-ghost" 
                        id="refresh-mappings-btn"
                        title="{% trans 'Refresh' %}"
                        hx-trigger="click"
                        hx-post=""
                        hx-on:click="htmx.trigger('body', 'refreshMappings')">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Status Messages -->
        <div id="mapping-status" class="hidden mt-2"
             hx-on:htmx:afterSettle="setTimeout(() => { this.classList.add('hidden'); this.innerHTML = ''; }, 4000)"
             hx-on:clearMappingInput="document.getElementById('mapping-name-input').value = ''"
             hx-on:clearMappingSelection="document.getElementById('mapping-select').value = ''"
             hx-on:refreshMappings="htmx.trigger('#mapping-select', 'load')">
            <!-- Success/error messages will appear here -->
        </div>
    </div>
</div>
