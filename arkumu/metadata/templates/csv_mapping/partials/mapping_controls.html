{% load i18n %}

<!-- Horizontal Mapping Controls Bar -->
<div class="bg-gradient-to-r from-base-100 to-base-200 border-b border-base-300 shadow-sm">
    <div class="px-4 py-3">
        <!-- Header Row -->
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3">
                <div class="avatar placeholder">
                    <div class="bg-primary text-primary-content rounded-full w-6 h-6">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                    </div>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-base-content">{% trans "Mapping Management" %}</h3>
                    <p class="text-xs text-base-content/70">{% trans "Save, load, and manage CSV mapping configurations" %}</p>
                </div>
            </div>
            
            <!-- Collapse Toggle -->
            <button class="btn btn-ghost btn-xs" onclick="toggleMappingControls()">
                <svg class="w-4 h-4 transition-transform duration-200" id="mapping-toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </div>
        
        <!-- Controls Content (Collapsible) -->
        <div id="mapping-controls-content" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- Save Section -->
            <div class="bg-base-100 rounded-lg p-3 border border-base-300">
                <div class="flex items-center gap-2 mb-2">
                    <div class="badge badge-success badge-sm">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        {% trans "Save Configuration" %}
                    </div>
                </div>
                {% include "csv_mapping/partials/mapping_save_section.html" %}
            </div>
            
            <!-- Load/Manage Section -->
            <div class="bg-base-100 rounded-lg p-3 border border-base-300">
                <div class="flex items-center gap-2 mb-2">
                    <div class="badge badge-info badge-sm">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
                        </svg>
                        {% trans "Load & Manage" %}
                    </div>
                </div>
                
                <div class="space-y-2">
                    <!-- Mapping Selection -->
                    <div class="form-control">
                        <select id="mapping-select" 
                                name="mapping_id"
                                class="select select-bordered select-sm focus:select-primary w-full"
                                {% if organization_id %}
                                hx-get="{% url 'metadata:csv_list_mappings' %}"
                                hx-vals='{"organization": "{{ organization_id }}"}'
                                hx-trigger="load, refreshMappings from:body"
                                hx-target="this"
                                hx-swap="innerHTML"
                                hx-on:change="
                                    const mappingId = this.value;
                                    const organization = '{{ organization_id }}';
                                    
                                    // Update load button state
                                    htmx.ajax('GET', '{% url 'metadata:csv_update_button_state' %}', {
                                        values: {button: 'load', mapping_id: mappingId, organization: organization},
                                        target: '#load-mapping-btn',
                                        swap: 'outerHTML'
                                    });
                                    
                                    // Update delete button state  
                                    htmx.ajax('GET', '{% url 'metadata:csv_update_button_state' %}', {
                                        values: {button: 'delete', mapping_id: mappingId, organization: organization},
                                        target: '#delete-mapping-btn',
                                        swap: 'outerHTML'
                                    });
                                "
                                {% endif %}>
                            {% if organization_id %}
                            <option value="">{% trans "🔍 Select saved mapping..." %}</option>
                            {% else %}
                            <option value="">{% trans "⚠️ Select organization first..." %}</option>
                            {% endif %}
                        </select>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="flex gap-2">
                        <button class="btn btn-sm btn-info flex-1" 
                                id="load-mapping-btn"
                                {% if organization_id %}
                                hx-post="{% url 'metadata:csv_load_mapping_htmx' %}"
                                hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "button": "load"}'
                                hx-include="#mapping-select"
                                hx-target="#mapping-status"
                                hx-swap="innerHTML"
                                hx-confirm="{% trans 'Replace current mapping?' %}"
                                hx-trigger="click"
                                {% endif %}
                                disabled>
                            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
                            </svg>
                            {% trans "Load" %}
                            <span class="loading loading-spinner loading-xs htmx-indicator ml-1"></span>
                        </button>
                        
                        <button class="btn btn-sm btn-warning" 
                                id="delete-mapping-btn"
                                {% if organization_id %}
                                hx-post="{% url 'metadata:csv_delete_mapping_htmx' %}"
                                hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}", "button": "delete"}'
                                hx-include="#mapping-select"
                                hx-target="#mapping-status"
                                hx-swap="innerHTML"
                                hx-confirm="{% trans 'Delete permanently?' %}"
                                hx-trigger="click"
                                {% endif %}
                                disabled>
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                            <span class="hidden sm:inline ml-1">{% trans "Delete" %}</span>
                            <span class="loading loading-spinner loading-xs htmx-indicator ml-1"></span>
                        </button>
                        
                        <div class="tooltip tooltip-top" data-tip="{% trans 'Refresh list' %}">
                            <button class="btn btn-sm btn-ghost btn-circle" 
                                    id="refresh-mappings-btn"
                                    onclick="htmx.trigger('body', 'refreshMappings')">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Status Messages (Hidden) -->
        <div id="mapping-status" class="mt-3 hidden">
            <!-- Success/error messages will appear here but stay hidden -->
        </div>
    </div>
</div>

<script>
function toggleMappingControls() {
    const content = document.getElementById('mapping-controls-content');
    const icon = document.getElementById('mapping-toggle-icon');
    
    if (content.style.display === 'none') {
        content.style.display = 'grid';
        icon.style.transform = 'rotate(0deg)';
    } else {
        content.style.display = 'none';
        icon.style.transform = 'rotate(-90deg)';
    }
}

// Initialize collapsed state
document.addEventListener('DOMContentLoaded', function() {
    const content = document.getElementById('mapping-controls-content');
    const icon = document.getElementById('mapping-toggle-icon');
    if (content && icon) {
        content.style.display = 'none';
        icon.style.transform = 'rotate(-90deg)';
    }
});
</script>
