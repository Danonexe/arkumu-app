{% load i18n %}

<!-- Mapping Save/Load Controls -->
<div class="bg-base-200 rounded-lg p-4 mb-4" id="mapping-controls">
    <div class="flex flex-col lg:flex-row gap-4 items-start lg:items-end">
        
        <!-- Save Mapping Section -->
        <div class="flex-1">
            <label class="label">
                <span class="label-text font-medium">{% trans "Save Current Mapping" %}</span>
            </label>
            <div class="flex gap-2">
                <input type="text" 
                       id="mapping-name-input" 
                       class="input input-bordered input-sm flex-1" 
                       placeholder="{% trans 'Enter mapping name...' %}"
                       maxlength="255">
                <button class="btn btn-sm btn-primary gap-2" 
                        id="save-mapping-btn"
                        hx-post="{% url 'metadata:csv_save_mapping' %}"
                        hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                        hx-include="#mapping-name-input"
                        hx-trigger="click"
                        hx-indicator=".save-loading">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    {% trans "Save" %}
                    <span class="loading loading-spinner loading-xs save-loading htmx-indicator"></span>
                </button>
            </div>
            <div class="text-xs text-base-content/60 mt-1">
                {% trans "Save current dataset selections, columns, and FK relationships" %}
            </div>
        </div>
        
        <!-- Load Mapping Section -->
        <div class="flex-1">
            <label class="label">
                <span class="label-text font-medium">{% trans "Load Existing Mapping" %}</span>
            </label>
            <div class="flex gap-2">
                <select id="mapping-select" 
                        class="select select-bordered select-sm flex-1"
                        hx-get="{% url 'metadata:csv_list_mappings' %}"
                        hx-vals='{"organization": "{{ organization_id }}"}'
                        hx-trigger="load, change from:#refresh-mappings-btn"
                        hx-target="#mapping-select"
                        hx-swap="innerHTML">
                    <option value="">{% trans "Select a mapping..." %}</option>
                </select>
                <button class="btn btn-sm btn-secondary gap-2" 
                        id="load-mapping-btn"
                        hx-post="{% url 'metadata:csv_load_mapping' %}"
                        hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                        hx-include="#mapping-select"
                        hx-trigger="click"
                        hx-indicator=".load-loading"
                        hx-confirm="{% trans 'This will replace your current mapping configuration. Continue?' %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    {% trans "Load" %}
                    <span class="loading loading-spinner loading-xs load-loading htmx-indicator"></span>
                </button>
                <button class="btn btn-sm btn-ghost btn-square" 
                        id="refresh-mappings-btn"
                        title="{% trans 'Refresh mapping list' %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
            <div class="text-xs text-base-content/60 mt-1">
                {% trans "Load a previously saved mapping configuration" %}
            </div>
        </div>
        
        <!-- Mapping Management Actions -->
        <div class="flex gap-2 flex-shrink-0">
            <button class="btn btn-sm btn-error btn-outline gap-2" 
                    id="delete-mapping-btn"
                    hx-post="{% url 'metadata:csv_delete_mapping' %}"
                    hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                    hx-include="#mapping-select"
                    hx-trigger="click"
                    hx-indicator=".delete-loading"
                    hx-confirm="{% trans 'Are you sure you want to delete this mapping? This action cannot be undone.' %}"
                    disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
                {% trans "Delete" %}
                <span class="loading loading-spinner loading-xs delete-loading htmx-indicator"></span>
            </button>
        </div>
    </div>
    
    <!-- Status Messages -->
    <div id="mapping-status" class="mt-3 hidden">
        <!-- Success/error messages will appear here -->
    </div>
</div>

<!-- JavaScript for enhanced UX -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const mappingSelect = document.getElementById('mapping-select');
    const deleteBtn = document.getElementById('delete-mapping-btn');
    const loadBtn = document.getElementById('load-mapping-btn');
    const saveBtn = document.getElementById('save-mapping-btn');
    const nameInput = document.getElementById('mapping-name-input');
    
    // Enable/disable buttons based on selection
    function updateButtonStates() {
        const hasSelection = mappingSelect.value !== '';
        const hasName = nameInput.value.trim() !== '';
        
        deleteBtn.disabled = !hasSelection;
        loadBtn.disabled = !hasSelection;
        saveBtn.disabled = !hasName;
        
        // Update button classes
        if (hasSelection) {
            deleteBtn.classList.remove('btn-disabled');
            loadBtn.classList.remove('btn-disabled');
        } else {
            deleteBtn.classList.add('btn-disabled');
            loadBtn.classList.add('btn-disabled');
        }
        
        if (hasName) {
            saveBtn.classList.remove('btn-disabled');
        } else {
            saveBtn.classList.add('btn-disabled');
        }
    }
    
    // Listen for changes
    mappingSelect.addEventListener('change', updateButtonStates);
    nameInput.addEventListener('input', updateButtonStates);
    
    // Initialize button states
    updateButtonStates();
    
    // Handle HTMX responses
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.xhr.responseURL.includes('csv-save-mapping') || 
            evt.detail.xhr.responseURL.includes('csv-load-mapping') ||
            evt.detail.xhr.responseURL.includes('csv-delete-mapping')) {
            
            const response = JSON.parse(evt.detail.xhr.response);
            const statusDiv = document.getElementById('mapping-status');
            
            statusDiv.classList.remove('hidden');
            
            if (response.success) {
                statusDiv.innerHTML = `<div class="alert alert-success alert-sm"><span>${response.message}</span></div>`;
                
                // Clear input on successful save
                if (evt.detail.xhr.responseURL.includes('csv-save-mapping')) {
                    nameInput.value = '';
                }
                
                // Refresh mapping list
                if (evt.detail.xhr.responseURL.includes('csv-save-mapping') ||
                    evt.detail.xhr.responseURL.includes('csv-delete-mapping')) {
                    document.getElementById('refresh-mappings-btn').click();
                }
                
                // If loading, trigger full page refresh to show loaded data
                if (evt.detail.xhr.responseURL.includes('csv-load-mapping')) {
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                }
                
            } else {
                statusDiv.innerHTML = `<div class="alert alert-error alert-sm"><span>${response.error}</span></div>`;
            }
            
            // Auto-hide status after 5 seconds
            setTimeout(() => {
                statusDiv.classList.add('hidden');
            }, 5000);
            
            updateButtonStates();
        }
    });
});
</script>
