{% if datasets %}
    {% for dataset in datasets %}
        <div class="badge {% if dataset.name in selected_datasets %}badge-success{% else %}badge-outline badge-success{% endif %} badge-sm px-3 py-2 cursor-pointer hover:bg-success hover:text-success-content transition-all duration-200 rounded-full text-xs font-medium border-2 hover:shadow-md hover:scale-105"
             id="badge-{{ dataset.name|slugify }}"
             data-source="{{ dataset.source }}"
             data-dataset="{{ dataset.name }}"
             hx-post="{% url 'metadata:csv_toggle_dataset_card' %}"
             hx-vals='{"source": "{{ dataset.source }}", "dataset": "{{ dataset.name }}", "organization": "{{ organization_id }}", "action": "{% if dataset.name in selected_datasets %}remove{% else %}add{% endif %}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
             {% if dataset.name in selected_datasets %}
             hx-target="#dataset-{{ dataset.name|slugify }}"
             hx-swap="delete"
             {% else %}
             hx-target="#table-content"
             hx-swap="afterbegin"
             {% endif %}>
            {{ dataset.name }}
        </div>
    {% endfor %}
    
    {% if selected_datasets %}
        <!-- Clear Selected Datasets Button - only show when there are selected datasets -->
        <button class="btn btn-xs btn-outline btn-error hover:btn-error transition-all duration-200 text-xs font-medium ml-2"
                hx-post="{% url 'metadata:csv_clear_all_datasets' %}"
                hx-vals='{"organization": "{{ organization_id }}", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                hx-target="#dataset-badges"
                hx-swap="innerHTML"
                
                hx-on::"htmx:beforeRequest: this.disabled = true"
                hx-on::"htmx:afterRequest: this.disabled = false"
                hx-on::"htmx:responseError: console.error('Clear datasets failed:', event.detail); this.disabled = false"
                title="Clear selected datasets (keep workspace columns)">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
            Clear Selected
        </button>
    {% endif %}
{% else %}
    <div class="badge badge-outline badge-ghost badge-sm px-3 py-2 text-xs font-medium border-2 rounded-full">No datasets found</div>
{% endif %}
