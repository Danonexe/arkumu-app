<!-- Modal Header -->
<div class="flex items-center justify-between p-6 border-b border-base-300">
    <div class="flex items-center gap-3">
        <div class="badge badge-primary">GRAPH</div>
        <h3 class="font-bold text-lg">{{ mapping_name|default:"Mapping Relationships" }}</h3>
        {% if mapping_description %}
        <div class="text-sm text-base-content/70">
            <span class="text-xs block">{{ mapping_description }}</span>
        </div>
        {% endif %}
    </div>
    <div class="flex items-center gap-2">
        <button class="btn btn-sm btn-circle btn-ghost" onclick="document.getElementById('mapping-graph-modal').close()">✕</button>
    </div>
</div>

<!-- Graph Canvas -->
<div class="relative" style="height: calc(83vh - 120px);">
    <div id="mapping-graph-canvas" class="w-full h-full bg-base-50">
        <!-- Graph visualization disabled -->
        <div class="absolute inset-0 flex items-center justify-center bg-base-100">
            <div class="text-center p-8">
                <svg class="w-16 h-16 mx-auto mb-4 text-base-content/30" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
                </svg>
                <h4 class="text-lg font-semibold mb-2">Graph Visualization Unavailable</h4>
                <p class="text-base-content/60 max-w-md">Graph visualization libraries have been removed from this application.</p>
                <button class="btn btn-sm btn-ghost mt-4" onclick="document.getElementById('mapping-graph-modal').close()">Close</button>
            </div>
        </div>
    </div>
</div>
