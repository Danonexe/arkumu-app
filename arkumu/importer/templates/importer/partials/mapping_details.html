{% if selected_mapping %}
    <!-- Show mapping summary -->
    <div class="alert alert-info">
        <h3 class="font-semibold">{{ selected_mapping.name }}</h3>
        <p class="text-sm">{{ selected_mapping.description|default:"No description" }}</p>
    </div>
    
    <!-- Mapping Overview Controls -->
    <div class="mt-4">
        <div class="flex items-center gap-2 mb-3">
            <span class="text-sm font-medium">Mapping Actions:</span>
        </div>
        <div class="flex gap-2">
            <button id="mapping-overview-btn" 
                    class="btn btn-primary btn-sm"
                    hx-get="{% url 'metadata:mapping_overview_data' %}"
                    hx-vals='{"organization": "{{ organization_id }}", "mapping_id": "{{ selected_mapping.id }}"}'
                    hx-target="#mapping-overview-modal"
                    hx-swap="outerHTML"
                    title="View mapping overview">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                Overview
            </button>
            <button id="mapping-graph-btn" 
                    class="btn btn-primary btn-sm"
                    hx-get="{% url 'metadata:mapping_graph_data' %}"
                    hx-vals='{"organization": "{{ organization_id }}", "mapping_id": "{{ selected_mapping.id }}"}'
                    hx-target="#mapping-graph-modal"
                    hx-swap="outerHTML"
                    title="View relationship graph">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
                </svg>
                Graph
            </button>
        </div>
    </div>
{% else %}
    <div class="text-center py-8 text-base-content/50">
        <p>Select a mapping to see details</p>
    </div>
{% endif %}
