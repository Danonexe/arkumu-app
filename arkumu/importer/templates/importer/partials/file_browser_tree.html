{% if total_files == 0 %}
    <div class="alert alert-warning">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 15.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
        <span>No CSV files found in {{ organization.name }}</span>
    </div>
{% else %}
    <div class="flex justify-between items-center mb-2">
        <div class="text-sm text-base-content/70">
            Found {{ total_files }} CSV file{{ total_files|pluralize }}
        </div>
        <div class="flex gap-1">
            <button class="btn btn-xs btn-primary"
                    hx-post="{% url 'importer:select_all_files' %}"
                    hx-vals='js:{organization: document.getElementById("organization-select").value}'
                    hx-target="#file-browser"
                    hx-swap="innerHTML">
                Select All
            </button>
            <button class="btn btn-xs btn-ghost"
                    hx-post="{% url 'importer:deselect_all_files' %}"
                    hx-vals='js:{organization: document.getElementById("organization-select").value}'
                    hx-target="#file-browser"
                    hx-swap="innerHTML">
                Clear
            </button>
        </div>
    </div>
    
    <!-- File Tree -->
    <div class="file-tree">
        {% include "importer/partials/file_tree_node.html" with node=file_tree node_name="metadata" level=0 selected_files=selected_files %}
    </div>

    <!-- Update parent template counters -->
    <script>
        // Update selected count and file list in parent
        const countEl = document.getElementById('selected-count');
        if (countEl) {
            countEl.textContent = '{{ selected_count }} file{{ selected_count|pluralize }}';
        }
        
        const filesList = document.getElementById('selected-files-list');
        if (filesList) {
            {% if selected_files %}
                const selectedFiles = [{% for file_key in selected_files %}'{{ file_key|split:"/" | last }}',{% endfor %}];
                filesList.innerHTML = selectedFiles.map(file => `<div class="truncate">• ${file}</div>`).join('');
            {% else %}
                filesList.innerHTML = '<div class="text-base-content/50">No files selected</div>';
            {% endif %}
        }
        
        // Trigger button state update
        if (typeof updateStartButton === 'function') {
            updateStartButton();
        }
    </script>
{% endif %}

<style>
.file-tree {
    font-size: 0.875rem;
}

.file-tree-node {
    margin-left: 0.5rem;
}

.file-tree-item {
    display: flex;
    align-items: center;
    padding: 0.25rem 0;
    cursor: pointer;
    transition: background-color 0.2s;
}

.file-tree-item:hover {
    background-color: hsl(var(--b2));
    border-radius: 0.25rem;
}

.file-tree-item.selected {
    background-color: hsl(var(--p) / 0.1);
}

.file-checkbox {
    margin-right: 0.5rem;
}

.folder-toggle {
    margin-right: 0.25rem;
    transition: transform 0.2s;
}

.folder-toggle.open {
    transform: rotate(90deg);
}

.folder-contents {
    margin-left: 1.5rem;
    display: none;
}

.folder-contents.open {
    display: block;
}
</style>
