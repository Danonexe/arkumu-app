openapi: 3.0.3
info:
  title: Arkumu CSV Import API
  description: API for importing CSV data into Arkumu
  version: 1.0.0
paths:
  /api/import/csv:
    post:
      summary: Import a single CSV file
      description: Upload and import a single CSV file with optional file columns configuration
      operationId: importSingleCsv
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                csv_file:
                  type: string
                  format: binary
                  description: CSV file to import
                dataset_name:
                  type: string
                  description: Name for the dataset (used in URI)
                institution:
                  type: string
                  description: Institution code
                  default: "DEFAULT"
                base_uri:
                  type: string
                  description: Base URI for generated resources
                  default: "http://arkumu.org/data"
                delimiter:
                  type: string
                  description: CSV column delimiter
                  default: ";"
                has_quoted_fields:
                  type: boolean
                  description: Whether fields in the CSV are quoted
                  default: false
                file_columns:
                  type: array
                  items:
                    type: string
                  description: List of column names that contain file paths
                files_base_directory:
                  type: string
                  description: Base directory for resolving relative file paths
              required:
                - csv_file
      responses:
        '200':
          description: Import successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStats'
        '400':
          description: Bad request
        '500':
          description: Server error

  /api/import/directory:
    post:
      summary: Import a directory of CSV files
      description: Import all CSV files from a specified directory with optional relationship configuration
      operationId: importCsvDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                directory_path:
                  type: string
                  description: Path to directory containing CSV files
                institution:
                  type: string
                  description: Institution code
                  default: "DEFAULT"
                base_uri:
                  type: string
                  description: Base URI for generated resources
                  default: "http://arkumu.org/data"
                delimiter:
                  type: string
                  description: CSV column delimiter
                  default: ";"
                has_quoted_fields:
                  type: boolean
                  description: Whether fields in the CSV are quoted
                  default: false
                relationship_config_path:
                  type: string
                  description: Path to relationship configuration JSON file
                file_columns:
                  type: object
                  description: Map of table names to lists of column names that contain file paths
                  additionalProperties:
                    type: array
                    items:
                      type: string
                files_base_directory:
                  type: string
                  description: Base directory for resolving relative file paths
              required:
                - directory_path
      responses:
        '200':
          description: Import successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStats'
        '400':
          description: Bad request
        '500':
          description: Server error
          
  /api/import/file-columns-config:
    post:
      summary: Create file columns configuration
      description: Create or update file columns configuration for CSV imports
      operationId: createFileColumnsConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: Map of table names to lists of column names that contain file paths
      responses:
        '200':
          description: Configuration saved successfully
        '400':
          description: Bad request
        '500':
          description: Server error
    
    get:
      summary: Get file columns configuration
      description: Retrieve current file columns configuration for CSV imports
      operationId: getFileColumnsConfig
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
        '404':
          description: Configuration not found
        '500':
          description: Server error

components:
  schemas:
    ImportStats:
      type: object
      properties:
        rows_processed:
          type: integer
          description: Number of rows processed
        cells_processed:
          type: integer
          description: Number of cells processed
        resources_created:
          type: integer
          description: Number of resources created
        triples_created:
          type: integer
          description: Number of triples created
        relationships_created:
          type: integer
          description: Number of relationships created
        files_uploaded:
          type: integer
          description: Number of files uploaded
        upload_errors:
          type: integer
          description: Number of file upload errors
        truncated_values:
          type: integer
          description: Number of values truncated due to size limits
        errors:
          type: integer
          description: Number of errors encountered 