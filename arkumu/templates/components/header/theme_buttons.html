<!-- Color Selection Buttons with Theme Switching -->
<div class="flex space-x-4 p-4 rounded-lg">
  <!-- Blue Button - Fixed appearance -->
  <button type="button" 
    class="theme-button px-6 py-2 rounded-full font-mono transition-colors
      border border-arkumu-blue text-arkumu-blue bg-white hover:bg-blue-50"
    data-theme="blue">
    Blau
  </button>
  
  <!-- Light Button - Fixed appearance -->
  <button type="button" 
    class="theme-button px-6 py-2 rounded-full font-mono transition-colors
      border border-gray-400 text-gray-700 bg-arkumu-hell hover:bg-gray-100"
    data-theme="light">
    Hell
  </button>
  
  <!-- Dark Button - Fixed appearance -->
  <button type="button" 
    class="theme-button px-6 py-2 rounded-full font-mono transition-colors
      border-none text-white bg-arkumu-dunkel hover:bg-opacity-90"
    data-theme="dark">
    Dunkel
  </button>
</div>
