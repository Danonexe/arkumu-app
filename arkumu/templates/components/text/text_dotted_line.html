<!-- Dotted Line Component - Exact Match to Reference -->
<div class="w-full my-8">
  <!-- Dotted line that spans the full width -->
  <div style="width: 100%; height: 1px; background-image: linear-gradient(to right, #000 10%, rgba(255, 255, 255, 0) 0%); background-position: top; background-size: 10px 1px; background-repeat: repeat-x; margin-bottom: 16px;"></div>
  
  <!-- Text label below the line -->
  <div class="text-xs font-mono">{{ text|default:"Teilnehmende Hochschulen" }}</div>
</div>
