{% extends "account/base.html" %}

{% load i18n %}
{% load account socialaccount %}
{% load crispy_forms_tags %}

{% block head_title %}{% translate "Sign In" %}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
      <div class="bg-arkumu-blue text-white p-4">
        <h1 class="text-xl font-bold">{% translate "Sign In" %}</h1>
      </div>
      <div class="p-6">
        
        <form class="login" method="POST" action="{% url 'account_login' %}">
          {% csrf_token %}
          <div class="mb-4">
            <label for="id_login" class="block text-sm font-medium mb-2">Username</label>
            <input type="text" name="login" id="id_login" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-arkumu-blue">
          </div>
          <div class="mb-4">
            <label for="id_password" class="block text-sm font-medium mb-2">Password</label>
            <input type="password" name="password" id="id_password" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-arkumu-blue">
          </div>
          {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
          {% endif %}
          
          <div class="flex justify-center mt-6">
            <button class="py-2 px-4 rounded-md bg-arkumu-blue hover:bg-arkumu-blue-hover text-white font-medium transition-colors" type="submit">
              {% translate "Sign In" %}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
