{% extends "base.html" %}

{% block title %}{% block head_title %}{% endblock head_title %}{% endblock title %}

{% block css %}
  {{ block.super }}
  <!-- Additional account-specific styling -->
  <style>
    .account-header {
      margin-bottom: 2rem;
    }
    .card {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border: none;
    }
    .card-header {
      background-color: #007bff;
      color: white;
      font-weight: 500;
      padding: 1rem;
    }
    .btn-primary {
      background-color: #007bff;
      border-color: #007bff;
    }
    .btn-primary:hover {
      background-color: #0069d9;
      border-color: #0062cc;
    }
    .btn-success {
      background-color: #28a745;
      border-color: #28a745;
    }
    .btn-success:hover {
      background-color: #218838;
      border-color: #1e7e34;
    }
  </style>
{% endblock css %}
