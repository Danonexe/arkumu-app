<label class="label">
    <span class="label-text">Organization</span> 
</label>
<select id="organization" name="organization" class="select select-bordered w-full select-sm"
        hx-get="/storage/dashboard/"
        hx-target="body"
        hx-trigger="change"
        hx-include="this">
    <option value="">Choose organization...</option>
    {% for org in organizations %}
        <option value="{{ org.code }}" {% if org.code == selected_org_slug %}selected{% endif %}>
            {{ org.name }}{% if org.is_active %} ✓{% endif %}
        </option>
    {% endfor %}
</select>
<div class="label">
    <span class="label-text-alt">✓ indicates S3 bucket already exists</span>
</div>
