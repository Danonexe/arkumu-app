<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Graph Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.2/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://unpkg.com/cytoscape@3.32.0/dist/cytoscape.min.js"></script>
</head>
<body>
    <div class="p-8">
        <h1 class="text-2xl font-bold mb-4">Test Graph Modal</h1>
        
        <!-- Button to open modal -->
        <button class="btn btn-primary" onclick="document.getElementById('mapping-graph-modal').showModal()">
            Open Graph Modal
        </button>
        
        <!-- Include the modal -->
        {% include 'csv_mapping/partials/mapping_graph_modal.html' %}
    </div>
    
    <!-- Test button to trigger HTMX load -->
    <button class="btn btn-secondary mt-4" 
            hx-get="/metadata/mapping-graph-data/"
            hx-vals='{"organization": "fuk", "mapping_id": "002b4fd5-cf25-4c80-8577-f643bd4f59b5"}'
            hx-target="#mapping-graph-modal-content"
            hx-swap="innerHTML">
        Load Graph Data via HTMX
    </button>
    
    <script>
        // Direct test function to open modal with mock data
        function testGraphModal() {
            const modal = document.getElementById('mapping-graph-modal');
            modal.showModal();
            
            // Simulate loading graph content
            const modalContent = document.getElementById('mapping-graph-modal-content');
            modalContent.innerHTML = `
                <div class="h-full flex flex-col">
                    <div class="flex items-center justify-between p-6 border-b border-base-300 flex-shrink-0">
                        <h3 class="font-bold text-lg">Test Graph</h3>
                        <button class="btn btn-sm btn-circle btn-ghost" onclick="document.getElementById('mapping-graph-modal').close()">✕</button>
                    </div>
                    <div class="relative flex-1 overflow-hidden">
                        <div id="mapping-graph-canvas" class="absolute inset-0 bg-base-50"></div>
                    </div>
                </div>
            `;
            
            // Initialize a test graph
            setTimeout(() => {
                const cy = cytoscape({
                    container: document.getElementById('mapping-graph-canvas'),
                    elements: [
                        { data: { id: 'a', label: 'Node A' } },
                        { data: { id: 'b', label: 'Node B' } },
                        { data: { id: 'ab', source: 'a', target: 'b' } }
                    ],
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#666',
                                'label': 'data(label)'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 3,
                                'line-color': '#ccc',
                                'target-arrow-color': '#ccc',
                                'target-arrow-shape': 'triangle'
                            }
                        }
                    ],
                    layout: {
                        name: 'grid'
                    }
                });
                cy.fit();
            }, 100);
        }
    </script>
    
    <button class="btn btn-accent mt-4" onclick="testGraphModal()">
        Test Modal with Mock Graph
    </button>
</body>
</html>
